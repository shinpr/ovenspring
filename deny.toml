[advisories]
version = 2

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  # The platform verifier's Android support (jni macros) still builds on syn 2 while clap_derive
  # and serde_derive use syn 3.
  { name = "syn", version = "=2.0.119" },
  # ring (rustls's crypto provider for the HTTPS client) still depends on these older majors.
  { name = "getrandom", version = "=0.2.17" },
  { name = "windows-sys", version = "=0.52.0" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
