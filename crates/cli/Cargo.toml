[package]
name = "ovenspring"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "ovenspring"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ovenspring-agents = { version = "0.2.0", path = "../agents" }
ovenspring-core = { version = "0.2.0", path = "../core" }
ovenspring-daemon = { version = "0.2.0", path = "../daemon" }
ovenspring-integrations = { version = "0.2.0", path = "../integrations" }
ovenspring-server = { version = "0.2.0", path = "../server" }
ovenspring-store = { version = "0.2.0", path = "../store" }
serde_json = "1.0.154"
signal-hook = "0.4.6"

[dev-dependencies]
jiff = "1.0.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
