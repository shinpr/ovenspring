[package]
name = "ovenspring-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jiff = "1.0.1"
ovenspring-agents = { version = "0.3.1", path = "../agents" }
ovenspring-core = { version = "0.3.1", path = "../core" }
ovenspring-integrations = { version = "0.3.1", path = "../integrations" }
ovenspring-store = { version = "0.3.1", path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }

[dev-dependencies]
tempfile = "3.27.0"
