/* Form controls drawn from the tokens, not the operating system's defaults. */
select{-webkit-appearance:none;appearance:none;background-image:var(--caret);background-repeat:no-repeat;background-position:right var(--space-3) center;background-size:10px 6px;padding-right:calc(var(--space-3) * 2 + 10px)!important}
select:disabled{color:var(--color-text-muted);opacity:1}

input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex:none;width:16px;height:16px;margin:3px 0 0;border:1px solid var(--color-field-border);background:var(--color-raised);border-radius:var(--radius-control);cursor:pointer;display:inline-grid;place-content:center}
input[type=radio]{border-radius:50%}
input[type=radio]:checked{border-color:var(--color-accent);box-shadow:inset 0 0 0 3px var(--color-raised);background:var(--color-accent)}
input[type=checkbox]:checked{border-color:var(--color-accent);background:var(--color-accent) var(--check) center/12px 12px no-repeat}
input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px}
.proto input[type=checkbox]{background-color:#1f1813;border-color:#7a6c5c}

.ok{color:var(--color-ok)} .fail{color:var(--color-fail)} .accent{color:var(--color-accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype controls: not part of the product */
.proto{background:#2a1f16;color:#f2e9dc;font:13px/1.4 var(--font-sans);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}

.proto-btn{font:inherit;color:#f0a25a;background:none;border:1px solid #7a6c5c;border-radius:var(--radius-control);padding:2px 8px;cursor:pointer}

/* product chrome */
header.top{border-bottom:1px solid var(--color-line);background:var(--color-bg)}
.top-in{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-4) var(--space-6);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3) var(--space-6)}
.goalband{background:var(--color-raised);border-bottom:1px solid var(--color-line)}
.gb-in{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-3) var(--space-6);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);align-items:baseline}

.gb-a{font-size:var(--text-small);white-space:nowrap}
@media (max-width:760px){.gb-in{padding:var(--space-3) var(--space-4);grid-template-columns:1fr}}
/* On a narrow screen the repository moves to a line of its own rather than shrinking out of sight. */
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-1) var(--space-3);max-width:100%}
.brand .word{display:inline-flex;color:var(--color-text);text-decoration:none}
.brand .word svg{display:block;overflow:visible}
/* The version follows the wordmark it belongs to; a rule sets the repository apart from it. */
.brand .ver{color:var(--color-text-muted);font-size:var(--text-small);white-space:nowrap}
.brand .repo{padding-left:var(--space-3);border-left:1px solid var(--color-line);flex-shrink:0;max-width:100%;color:var(--color-text-muted);font-size:var(--text-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-end{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-6)}
[data-nav-only][hidden]{display:none}

nav.main a:hover{color:var(--color-text)}
nav.main a[aria-current="page"]{color:var(--color-text);font-weight:700}
.theme{font-size:var(--text-small);color:var(--color-text-muted);display:flex;gap:6px;align-items:center}
.theme select{font:inherit;color:var(--color-text);background-color:var(--color-raised);border:1px solid var(--color-field-border);border-radius:var(--radius-control);padding:2px 9px}

main{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-7)}

.stack>*+*{margin-top:var(--space-6)}

/* status line */
.status{padding:0}
.status .what{font-weight:600;font-size:var(--text-page-title);line-height:1.2;letter-spacing:-.01em}
.status .how{font-size:var(--text-lead)}
.status+*{margin-top:var(--space-7)!important}
.status.halt .what{color:var(--color-fail)}
.status.yours .what{color:var(--color-accent)}
.status .how{margin-top:var(--space-2);color:var(--color-text);max-width:72ch}
.status .how+.how{margin-top:var(--space-1)}
.need-list{margin-top:var(--space-4);max-width:72ch}
/* grouping: regions, groups, items (see How this was designed, 6) */
.region{margin-top:var(--space-7)}
.grp{margin-top:var(--space-6)}
.grp>h2{margin-bottom:var(--space-2)}
.grp>.list,.grp>.path,.grp>.whatis{margin-top:var(--space-5)}
.list>*+*{border-top:1px solid var(--color-line)}
.ctx{font-size:var(--text-lead)}
.subh{margin:var(--space-5) 0 var(--space-2)}
.grp>p,.grp>.whatis,.grp>details,.grp>.links,.grp>.subh,.grp>.kv,.grp>.actions,.grp>.empty{padding-left:var(--space-2);padding-right:var(--space-2)}
.grp>p+p{margin-top:var(--space-1)}
.grp>.list.kr,.grp>.kv{margin-top:var(--space-2)}
.grp>.actions,.grp>details{margin-top:var(--space-3)}
.rname{font-weight:700;text-transform:capitalize}
.item{padding:var(--space-3) var(--space-2)}
.item>p+p{margin-top:var(--space-1)}
.whatis{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--space-3) var(--space-4);margin:0;max-width:72ch}
.whatis dt{color:var(--color-text-muted)} .whatis dd{margin:0}
.inow{font-size:var(--text-lead);margin-top:var(--space-5);max-width:72ch}
/* glance rows on Now */
.wrow{display:grid;grid-template-columns:88px minmax(0,1fr) 100px 220px 104px;gap:var(--space-4);padding:var(--space-3) var(--space-2);align-items:baseline}
.wrow .k{font-family:var(--font-mono);font-size:var(--text-mono)}
.wrow .k a{color:var(--color-text-muted);text-decoration:none}
.wrow .t a{color:var(--color-text);text-decoration:none;font-weight:500}
.wrow .t a:hover,.wrow .k a:hover{text-decoration:underline}
.wrow .ph-w{color:var(--color-text-muted)}
.wrow .meta{color:var(--color-text-muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.yours{color:var(--color-accent);font-weight:600;text-decoration:none}

.wrow .fail{font-weight:600}
@media (max-width:959px){
  .wrow{grid-template-columns:88px auto auto minmax(0,1fr);grid-template-areas:"key title title title" ". phase status meta";gap:var(--space-1) var(--space-3)}
  .wrow .k{grid-area:key} .wrow .t{grid-area:title} .wrow .ph-w{grid-area:phase} .wrow .st-w{grid-area:status}
  .wrow .meta{grid-area:meta;text-align:left}
  .wrow .ph-w:not(:empty)::after{content:" ·"}
  /* With no phase, the status starts under the title, as the phase would. */
  .wrow .ph-w:empty{display:none} .wrow .ph-w:empty+.st-w{grid-column-start:phase}
}
@media (max-width:760px){
  .whatis{grid-template-columns:1fr;gap:0} .whatis dd{margin-bottom:var(--space-3)}
}

.context{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:var(--text-small)}
.context dt{color:var(--color-text-muted)}
.context dd{margin:0;min-width:0}

/* sections and rows */
section>h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-5)}

.rows{border-top:1px solid var(--color-line)}

.row.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1.49fr)}

.phase{font-size:var(--text-small);color:var(--color-text-muted);padding-top:1px}

.need{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-line);align-items:center}
.need .ask{font-weight:600;color:var(--color-text)}
.need .about{font-size:var(--text-small);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:var(--text-small);border-radius:var(--radius-control);padding:7px 12px;cursor:pointer;text-decoration:none;border:1px solid var(--color-field-border);background:var(--color-bg);color:var(--color-text);white-space:nowrap}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--color-accent);padding:4px 6px}
.btn[disabled],.btn.primary[disabled]{background:transparent;border-color:var(--color-line);color:var(--color-text-muted);cursor:not-allowed}
.secret .reveal:hover{color:var(--color-text)}

fieldset.field{border:0;padding:0;margin-left:0;margin-right:0;min-width:0}
fieldset.field>legend{padding:0;font-weight:600;font-size:var(--text-small)}
.secret .reveal:focus-visible{outline-offset:-3px}
.choice-more{padding-left:24px;margin:-2px 0 var(--space-4)}
.choice-more:last-child{margin-bottom:0}
.choice-more>.field:first-child{margin-top:var(--space-2)}
.opt{font-weight:400}
.stepper{list-style:none;margin:var(--space-2) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 24px;font-size:var(--text-small)}
.setup>.su-block{margin-top:var(--space-5);border-top:1px solid var(--color-line);padding-top:var(--space-5)}
.setup>.actions{margin-top:var(--space-6)}
.setup .su-form>.actions{margin-top:var(--space-6)}
.setup .err-summary{margin-top:var(--space-6)}
.setup .err-summary:not([hidden])+.actions{margin-top:var(--space-3)}
.su-block>h3+p{margin-top:4px}
.su-status{margin-top:var(--space-3);min-height:calc(var(--text-small) * 1.6)}
/* The result's line is kept while a block has none, so a check starting as a field is left moves nothing below it. */
.err-summary{border:1px solid var(--color-line);border-left:4px solid var(--color-fail);background:var(--color-raised);border-radius:var(--radius-control);padding:var(--space-3) var(--space-4)}

  {d:'27', t:'08:40', err:'linear', start:true, s:'Linear refused the connection (HTTP 401). No new issue is read and no sprint is proposed until it is fixed.', times:4, last:'11:12'},
  {d:'26', t:'18:30', s:'Resumed. You sent <code>!resume</code> in Slack.'},
  {d:'26', t:'17:02', err:'agent', clear:true, s:'Claude Code starts again.'},
  {d:'26', t:'16:48', err:'agent', start:true, issue:'ACME-139', s:'Claude Code could not start a run: <code>Not logged in · Please run /login</code>.', times:3, last:'16:58'},
  {d:'26', t:'16:10', s:'Paused. You sent <code>!pause</code> in Slack: <q>lunch</q>.'},
  {d:'26', t:'15:44', issue:'ACME-139', s:'Merged pull request #84 into <code>main</code>.'}
];
/* Errors going on in "open": the two above that have started and not cleared. */
const OPEN = [
  {key:'github', what:"Can't reach GitHub", since:'13:41', times:23, last:'14:19', issue:'ACME-142', fix:'Nothing to do unless it lasts. The factory tries again every 30 seconds.'},
  {key:'filter', what:'The issue filter fails', since:'14:05', times:6, last:'14:17', issue:'ACME-153', fix:'Issues go on as without a filter until it works. Fix <code>./.ovenspring/filter-issue.sh</code> or change it in <a href="#/settings/connections">Settings</a>.'}
];

let SIT = 'open', NOTICES = true, SHOW = 'all', ISSUE = 'all', MORE = false, EDIT = false;
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function why(text){ return `<div class="why" role="note"><b>Why this is here:</b> ${text}</div>`; }
function ext(href, label){ return `<a href="${href}" target="_blank" rel="noopener">${label}<span aria-hidden="true"> ↗</span><span class="sr"> (opens in a new tab)</span></a>`; }
function setTheme(v){ if (v==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); }
function setSit(v){ SIT=v; NOTICES = v!=='off'; $('#sit').value=v; render(); }

function events(){
  if (SIT==='new') return [];
  /* "Nothing wrong now": the two errors going on cleared. */
  if (SIT==='clear') return [
    {d:'27', t:'14:19', err:'filter', clear:true, issue:'ACME-153', s:'The issue filter works again.'},
    {d:'27', t:'14:16', err:'github', clear:true, s:'GitHub answers again.'}, ...EV.map(e=>e.start&&OPEN.some(o=>o.key===e.err)?Object.assign({},e,{cleared:true}):e)];
  if (SIT==='off') { const i = EV.findIndex(e=>e.t<'12:30'); return [...EV.slice(0,i), {d:'27', t:'12:30', s:'Settings changed: Error notices are now off.'}, ...EV.slice(i)]; }
  return EV;
}
function lostNote(){ return SIT==='lost'?`<p class="contact" role="status">The dashboard lost contact with the factory. This page is as it was at ${NOW}.</p>`:''; }

/* ---- events page */
function line(e){
  const subj = e.issue ? `<a href="#/issue/${e.issue}">${e.issue}</a>` : (e.sprint ? `<a href="#/sprints">Sprint</a>` : '');
  let mark = '';
  if (e.start) mark = `<span class="fail ev-w">Error</span> `;
  if (e.clear) mark = `<span class="ok ev-w">Cleared</span> `;
  const after = [];
  const stillOpen = OPEN.some(o=>o.key===e.err) && !e.cleared;
  if (e.start && e.times>1) after.push(stillOpen ? `Happened ${e.times} times so far, last at ${e.last}.` : `Happened ${e.times} times, last at ${e.last}.`);
  /* In "off", the notices were turned off at 12:30: errors before it were told, the ones after it not. */
  if (e.start||e.clear) after.push(NOTICES || e.d<'27' || e.t<'12:30' ? 'You were told in Slack.' : 'Not told: error notices are off.');
  if (e.url) after.push(ext(e.url, 'Linear issue'));
  return `<li class="ev ev2"><span class="tm">${e.t}</span><span class="k">${subj}</span><span class="txt">${mark}${e.s}${after.length?`<span class="ev-after muted">${after.join(' ')}</span>`:''}</span></li>`;
}
function viewEvents(){
  const all = events();
  const shown = all.filter(e => (SHOW==='all' || (SHOW==='errors' && (e.start||e.clear)) || (SHOW==='filter' && (e.drop || e.err==='filter')))
                           && (ISSUE==='all' || e.issue===ISSUE));
  const page = MORE ? shown : shown.slice(0, 15);
  const open = SIT==='open' || SIT==='off' || SIT==='lost' ? OPEN : [];
  const filtered = SHOW!=='all' || ISSUE!=='all';
  const keys = [...new Set(all.filter(e=>e.issue).map(e=>e.issue))].sort();

  let list;
  if (SIT==='unreadable') list = `<p class="empty">The events could not be read. The dashboard tries again in a few seconds.</p>`;
  else if (!all.length) list = `<p class="empty">Nothing has been recorded yet.</p>`;
  else if (!shown.length) list = `<p class="empty">No event matches this filter.</p>`;
  else list = DAYS.map(([d,label])=>{ const es=page.filter(e=>e.d===d); return es.length?`<section aria-labelledby="day-${d}"><h3 class="subh" id="day-${d}">${label}</h3><ul class="rows list plainlist">${es.map(line).join('')}</ul></section>`:''; }).join('')
    + (shown.length>page.length ? `<div class="actions more"><button class="btn" onclick="MORE=true;render()">Show older events</button></div>` : (all.length&&!filtered?`<p class="empty end">That is everything the factory has recorded.</p>`:''));

  return `${lostNote()}<div class="stack"><div><h1>Events</h1><p class="muted" style="margin-top:4px">Everything the factory recorded, newest first.</p></div>
  ${why('<b>Answers:</b> what the factory did and whether something went wrong, without opening <code>events.jsonl</code> (AC-076). Activity stays the page for agent runs; this page holds everything else the factory records, its errors and the issue filter\'s drops and failures included.')}
  <section class="grp" aria-labelledby="h-errs"><h2 id="h-errs">Errors now</h2>
   ${why('<b>Answers:</b> is something wrong right now? An error starts at its first failure and clears when the same operation next succeeds; this group lists those not cleared, which are also the ones you were told started and have not yet been told cleared (AC-077).')}
   ${NOTICES?'':`<p class="small">Error notices are off, so Slack tells you nothing about these. <a href="#/settings/connections">Turn them on in Settings</a></p>`}
   ${SIT==='unreadable'?'<p class="empty">Not known while the events cannot be read.</p>':(open.length?`<ul class="rows list plainlist">${open.map(o=>`<li class="item"><p><span class="fail ev-w">${o.what}</span> <span class="muted">since ${o.since}${o.issue?`, first on <a href="#/issue/${o.issue}">${o.issue}</a>`:''}. ${o.times} times, last at ${o.last}.</span></p><p class="small">${o.fix}</p></li>`).join('')}</ul>`:`<p class="empty">Nothing is wrong now.</p>`)}
  </section>
  <section class="grp" aria-labelledby="h-ev"><h2 id="h-ev">What the factory did</h2>
   ${why('<b>Each line:</b> when, the issue or sprint it concerns (blank when it concerns the whole factory), and what happened as a sentence. An error\'s repeats are folded into the line where it started, so a failure that recurs every 30 seconds is one line, not hundreds. <b>Show</b> narrows to errors or to the issue filter (AC-072, AC-076); <b>Issue</b> to one issue.')}
   <div class="filters"><label>Show <select class="f" id="ev-show" onchange="SHOW=this.value;MORE=false;render()"><option value="all" ${SHOW==='all'?'selected':''}>Everything</option><option value="errors" ${SHOW==='errors'?'selected':''}>Errors and when they cleared</option><option value="filter" ${SHOW==='filter'?'selected':''}>The issue filter's drops and failures</option></select></label>
    <label>Issue <select class="f" id="ev-issue" onchange="ISSUE=this.value;MORE=false;render()"><option value="all">All issues</option>${keys.map(k=>`<option value="${k}" ${ISSUE===k?'selected':''}>${k} ${esc(ISSUES[k]||'')}</option>`).join('')}</select></label></div>
   <div class="evlist">${list}</div>
  </section></div>`;
}

/* ---- settings: the Connections section with the new row after Slack */
function viewSettings(){
  const row = `<div class="srow" id="row-notices"><div class="lbl">Error notices<span class="what">A message in Slack when an error starts and when it clears.</span></div>
   <div class="val">${NOTICES?'<b>On</b>':'<b>Off</b>. Errors still show on <a href="#/events">Events</a>.'}</div>
   <div>${EDIT?'':`<button class="btn" onclick="EDIT=true;render();document.querySelector('#row-notices input').focus()">Change</button>`}</div>
   ${EDIT?`<div class="edit" role="group" aria-label="Change Error notices"><fieldset class="field"><legend>Error notices</legend><div class="choices">
     <label class="choice"><input type="radio" name="nt" value="on" ${NOTICES?'checked':''}><span><b>On</b> (default)</span><span class="note">One message when an error starts and one when it clears, however often it repeats in between.</span></label>
     <label class="choice"><input type="radio" name="nt" value="off" ${NOTICES?'':'checked'}><span><b>Off</b></span><span class="note">No messages about errors. The Events page still shows every error.</span></label></div></fieldset>
     <div class="actions"><button class="btn primary" onclick="NOTICES=document.querySelector('input[name=nt]:checked').value==='on';EDIT=false;render()">Save</button><button class="btn" onclick="EDIT=false;render()">Cancel</button><span class="applies">Applies at once.</span></div></div>`:''}</div>`;
  const plain = (label, what, val) => `<div class="srow"><div class="lbl">${label}<span class="what">${what}</span></div><div class="val">${val}</div><div><button class="btn" onclick="alert('Not part of this prototype.')">Change</button></div></div>`;
  return `<div><h1 style="margin-bottom:16px">Settings</h1>
  <div class="settings"><nav class="snav" aria-label="Settings sections">${[['connections','Connections'],['agents','Agents'],['merging','Merging'],['safety','Safety and limits'],['product','Running the product']].map(([k,l])=>`<a href="#/settings/connections" ${k==='connections'?'aria-current="page"':''}>${l}</a>`).join('')}</nav>
  <div><section class="grp sgrp"><h2>Connections</h2><p class="small muted" style="margin:4px 0 10px">Each connection is checked when you save it. A failed check saves nothing.</p>
  ${plain('GitHub','Where the factory pushes, opens pull requests and merges.','<div class="line">Repository <b>acme/acme-shop</b> (this folder\'s <code>origin</code>)</div><div class="line">Acting as <b>acme-factory-bot</b>, with the token you entered</div><div class="state ok">Connected when last saved</div>')}
  ${plain('Issue tracker','Where the issues come from, and where the factory marks them started and done.','<div class="line">Linear, team <b>ACME</b></div><div class="line">API key set</div><div class="line">Issues filtered by <code>./.ovenspring/filter-issue.sh</code></div><div class="state ok">Connected when last saved</div>')}
  ${plain('Slack','Where every decision reaches you and where you talk with the lead.','<div class="line">Channel <code>C0123456789</code></div><div class="line">Bot token and app-level token set</div><div class="state ok">Connected when last saved</div>')}
  ${row}
  ${why('<b>Where:</b> after Slack, since that is where the notices go, so the row is in Connections rather than a section of its own (AC-078). <b>Off</b> stops only the notices; the Events page keeps every event, errors included. Saved in <code>.ovenspring/config.toml</code>.')}
  ${plain('Who the factory answers','Only these Slack members can approve, answer and pause.','<div class="line"><code>U01ABCDE2FG</code></div>')}
  </section></div></div></div>`;
}

/* ---- not part of the product: the two Slack notices, as they read */
function viewSlack(){
  const msg = (t, body) => `<li class="item"><p class="small muted">${t}</p><div class="said">${body}</div></li>`;
  return `<div class="stack"><div><p class="crumbs">Prototype only</p><h1>The Slack notices</h1><p class="muted" style="margin-top:4px">What an error notice says in the channel. Each is one message with no button, sent only while error notices are on.</p></div>
  <section class="grp"><h2>When an error starts</h2><ul class="rows list plainlist">
   ${msg('13:41', `<b>Error: can't reach GitHub.</b> It failed while reading ACME-142's pull request: HTTP 502.\nThe factory tries again every 30 seconds. You will hear once more when it clears.\n<a href="#/events">See it on Events</a>`)}
   ${msg('14:05', `<b>Error: the issue filter fails.</b> <code>./.ovenspring/filter-issue.sh</code> exited with 127 on ACME-153 (<code>jq: command not found</code>).\nIssues go on as without a filter until it works. You will hear once more when it clears.\n<a href="#/events">See it on Events</a>`)}</ul></section>
  <section class="grp"><h2>When it clears</h2><ul class="rows list plainlist">
   ${msg('14:16', `<b>Cleared: GitHub answers again.</b> It failed 23 times from 13:41.`)}
   ${msg('14:19', `<b>Cleared: the issue filter works again.</b> It failed 6 times from 14:05. Issues it could not judge meanwhile are judged now.`)}</ul></section></div>`;
}
function viewOther(name){
  return `<div class="stack"><div><h1>${name}</h1><p class="muted" style="margin-top:4px">Unchanged by this issue. This prototype shows only the Events page and the Error notices row in Settings.</p></div></div>`;
}

function render(){
  const h = location.hash || '#/events';
  const page = h.startsWith('#/settings') ? 'settings' : h.slice(2).split('/')[0];
  document.querySelectorAll('nav.main a').forEach(a => a.getAttribute('data-nav')===page ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('#app').innerHTML = page==='settings' ? viewSettings() : page==='slack' ? viewSlack() : page==='events' ? viewEvents()
    : viewOther({now:'Now', activity:'Activity', sprints:'Sprints', issue:'Issue'}[page] || 'Now');
}
window.addEventListener('hashchange', ()=>{ EDIT=false; render(); window.scrollTo(0,0); });
render();
</script>
</body>
