<style>
:root,
:root[data-theme="light"] {
  --color-bg: #f7f3ec;
  --color-raised: #fffdf9;
  --color-line: #e4dccf;
  --color-field-border: #8a7c6b;
  --color-text: #2a1f16;
  --color-text-muted: #6e6152;
  --color-accent: #9c4416;
  --color-on-accent: #fffdf9;
  --color-ok: #3f6b33;
  --color-fail: #a3301c;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg: #16110d;
    --color-raised: #1f1813;
    --color-line: #30271f;
    --color-field-border: #7a6c5c;
    --color-text: #f2e9dc;
    --color-text-muted: #ab9d8b;
    --color-accent: #f0a25a;
    --color-on-accent: #16110d;
    --color-ok: #a3c98f;
    --color-fail: #f08a72;
  }
}

:root[data-theme="dark"] {
  --color-bg: #16110d;
  --color-raised: #1f1813;
  --color-line: #30271f;
  --color-field-border: #7a6c5c;
  --color-text: #f2e9dc;
  --color-text-muted: #ab9d8b;
  --color-accent: #f0a25a;
  --color-on-accent: #16110d;
  --color-ok: #a3c98f;
  --color-fail: #f08a72;
}

:root {
  --font-sans: "Hanken Grotesk Variable", "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Menlo", monospace;
  --text-headline: 32px;
  --text-page-title: 30px;
  --text-section-title: 22px;
  --text-wordmark: 18px;
  --text-lead: 17px;
  --text-body: 15px;
  --text-small: 14px;
  --text-mono: 13px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 40px;
  --space-7: 64px;
  --radius-control: 4px;
  --width-content: 1200px;
}
:root{color-scheme:light;--caret:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2710%27%20height%3D%276%27%20viewBox%3D%270%200%2010%206%27%3E%3Cpath%20d%3D%27M1%201l4%204%204-4%27%20fill%3D%27none%27%20stroke%3D%27%236e6152%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");--check:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2712%27%20height%3D%2712%27%20viewBox%3D%270%200%2012%2012%27%3E%3Cpath%20d%3D%27M2.5%206.2l2.3%202.3%204.7-5%27%20fill%3D%27none%27%20stroke%3D%27%23fffdf9%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");}
:root[data-theme="dark"]{color-scheme:dark;--caret:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2710%27%20height%3D%276%27%20viewBox%3D%270%200%2010%206%27%3E%3Cpath%20d%3D%27M1%201l4%204%204-4%27%20fill%3D%27none%27%20stroke%3D%27%23ab9d8b%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");--check:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2712%27%20height%3D%2712%27%20viewBox%3D%270%200%2012%2012%27%3E%3Cpath%20d%3D%27M2.5%206.2l2.3%202.3%204.7-5%27%20fill%3D%27none%27%20stroke%3D%27%2316110d%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--caret:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2710%27%20height%3D%276%27%20viewBox%3D%270%200%2010%206%27%3E%3Cpath%20d%3D%27M1%201l4%204%204-4%27%20fill%3D%27none%27%20stroke%3D%27%23ab9d8b%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");--check:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2712%27%20height%3D%2712%27%20viewBox%3D%270%200%2012%2012%27%3E%3Cpath%20d%3D%27M2.5%206.2l2.3%202.3%204.7-5%27%20fill%3D%27none%27%20stroke%3D%27%2316110d%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E");}}

/* Form controls drawn from the tokens, not the operating system's defaults. */
select{-webkit-appearance:none;appearance:none;background-image:var(--caret);background-repeat:no-repeat;background-position:right var(--space-3) center;background-size:10px 6px;padding-right:calc(var(--space-3) * 2 + 10px)!important}
select:disabled{color:var(--color-text-muted);opacity:1}
.proto select{--caret:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2710%27%20height%3D%276%27%20viewBox%3D%270%200%2010%206%27%3E%3Cpath%20d%3D%27M1%201l4%204%204-4%27%20fill%3D%27none%27%20stroke%3D%27%23ab9d8b%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E")}
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex:none;width:16px;height:16px;margin:3px 0 0;border:1px solid var(--color-field-border);background:var(--color-raised);border-radius:var(--radius-control);cursor:pointer;display:inline-grid;place-content:center}
input[type=radio]{border-radius:50%}
input[type=radio]:checked{border-color:var(--color-accent);box-shadow:inset 0 0 0 3px var(--color-raised);background:var(--color-accent)}
input[type=checkbox]:checked{border-color:var(--color-accent);background:var(--color-accent) var(--check) center/12px 12px no-repeat}
input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px}
.proto input[type=checkbox]{background-color:#1f1813;border-color:#7a6c5c}
fieldset{margin:0;padding:0;border:0;min-width:0}
legend{padding:0}
textarea{resize:vertical}
::placeholder{color:var(--color-text-muted);opacity:1}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-body);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--color-accent);text-underline-offset:3px}
a:hover{color:var(--color-text)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px}
code,kbd,.mono{font-family:var(--font-mono);font-size:var(--text-mono)} code{overflow-wrap:anywhere} kbd{padding:0 5px;border:1px solid var(--color-line);border-radius:var(--radius-control);background:var(--color-raised)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:var(--text-page-title);line-height:1.2}
h2{font-size:var(--text-section-title);line-height:1.25}
h3{font-size:var(--text-lead);line-height:1.3}
p{margin:0}
.muted{color:var(--color-text-muted)}
.small{font-size:var(--text-small)}
.ok{color:var(--color-ok)} .fail{color:var(--color-fail)} .accent{color:var(--color-accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype controls: not part of the product */
.proto{background:#2a1f16;color:#f2e9dc;font:13px/1.4 var(--font-sans);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.proto b{font-weight:600;letter-spacing:.02em}
.proto label{display:flex;gap:6px;align-items:center}
.proto select{font:inherit;background-color:#1f1813;color:#f2e9dc;border:1px solid #7a6c5c;border-radius:var(--radius-control);padding:2px 4px}
.proto a{color:#f0a25a}
.proto .sep{opacity:.5}
.proto-btn{font:inherit;color:#f0a25a;background:none;border:1px solid #7a6c5c;border-radius:var(--radius-control);padding:2px 8px;cursor:pointer}

/* product chrome */
header.top{border-bottom:1px solid var(--color-line);background:var(--color-bg)}
.top-in{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-4) var(--space-6);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3) var(--space-6)}
.goalband{background:var(--color-raised);border-bottom:1px solid var(--color-line)}
.gb-in{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-3) var(--space-6);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);align-items:baseline}
.gb-l{color:var(--color-text-muted);font-size:var(--text-small)}
.gb-t{font-size:var(--text-lead);max-width:72ch}
.gb-t.none{color:var(--color-text-muted)}
.gb-a{font-size:var(--text-small);white-space:nowrap}
@media (max-width:760px){.gb-in{padding:var(--space-3) var(--space-4);grid-template-columns:1fr}}
/* On a narrow screen the repository moves to a line of its own rather than shrinking out of sight. */
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-1) var(--space-3);max-width:100%}
.brand .word{display:inline-flex;color:var(--color-text);text-decoration:none}
.brand .word svg{display:block;overflow:visible}
/* The version follows the wordmark it belongs to; a rule sets the repository apart from it. */
.brand .ver{color:var(--color-text-muted);font-size:var(--text-small);white-space:nowrap}
.brand .repo{padding-left:var(--space-3);border-left:1px solid var(--color-line);flex-shrink:0;max-width:100%;color:var(--color-text-muted);font-size:var(--text-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-end{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-6)}
[data-nav-only][hidden]{display:none}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{color:var(--color-text-muted);text-decoration:none;padding:6px 10px;font-weight:500}
nav.main a:hover{color:var(--color-text)}
nav.main a[aria-current="page"]{color:var(--color-text);font-weight:700}
.theme{font-size:var(--text-small);color:var(--color-text-muted);display:flex;gap:6px;align-items:center}
.theme select{font:inherit;color:var(--color-text);background-color:var(--color-raised);border:1px solid var(--color-field-border);border-radius:var(--radius-control);padding:2px 9px}

main{max-width:calc(var(--width-content) + 2*var(--space-6));margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-7)}
@media (max-width:759px){.top-in,main{padding-left:var(--space-4);padding-right:var(--space-4)}}
.stack>*+*{margin-top:var(--space-6)}

/* status line */
.status{padding:0}
.status .what{font-weight:600;font-size:var(--text-page-title);line-height:1.2;letter-spacing:-.01em}
.status .how{font-size:var(--text-lead)}
.status+*{margin-top:var(--space-7)!important}
.status.halt .what{color:var(--color-fail)}
.status.yours .what{color:var(--color-accent)}
.status .how{margin-top:var(--space-2);color:var(--color-text);max-width:72ch}
.status .how+.how{margin-top:var(--space-1)}
.need-list{margin-top:var(--space-4);max-width:72ch}
/* grouping: regions, groups, items (see How this was designed, 6) */
.region{margin-top:var(--space-7)}
.grp{margin-top:var(--space-6)}
.grp>h2{margin-bottom:var(--space-2)}
.grp>.list,.grp>.path,.grp>.whatis{margin-top:var(--space-5)}
.list>*+*{border-top:1px solid var(--color-line)}
.ctx{font-size:var(--text-lead)}
.subh{margin:var(--space-5) 0 var(--space-2)}
.grp>p,.grp>.whatis,.grp>details,.grp>.links,.grp>.subh,.grp>.kv,.grp>.actions,.grp>.empty{padding-left:var(--space-2);padding-right:var(--space-2)}
.grp>p+p{margin-top:var(--space-1)}
.grp>.list.kr,.grp>.kv{margin-top:var(--space-2)}
.grp>.actions,.grp>details{margin-top:var(--space-3)}
.rname{font-weight:700;text-transform:capitalize}
.item{padding:var(--space-3) var(--space-2)}
.item>p+p{margin-top:var(--space-1)}
.whatis{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--space-3) var(--space-4);margin:0;max-width:72ch}
.whatis dt{color:var(--color-text-muted)} .whatis dd{margin:0}
.inow{font-size:var(--text-lead);margin-top:var(--space-5);max-width:72ch}
/* glance rows on Now */
.wrow{display:grid;grid-template-columns:88px minmax(0,1fr) 100px 220px 104px;gap:var(--space-4);padding:var(--space-3) var(--space-2);align-items:baseline}
.wrow .k{font-family:var(--font-mono);font-size:var(--text-mono)}
.wrow .k a{color:var(--color-text-muted);text-decoration:none}
.wrow .t a{color:var(--color-text);text-decoration:none;font-weight:500}
.wrow .t a:hover,.wrow .k a:hover{text-decoration:underline}
.wrow .ph-w{color:var(--color-text-muted)}
.wrow .meta{color:var(--color-text-muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.yours{color:var(--color-accent);font-weight:600;text-decoration:none}
a.yours:hover{text-decoration:underline;color:var(--color-accent)}
.wrow .fail{font-weight:600}
@media (max-width:959px){
  .wrow{grid-template-columns:88px auto auto minmax(0,1fr);grid-template-areas:"key title title title" ". phase status meta";gap:var(--space-1) var(--space-3)}
  .wrow .k{grid-area:key} .wrow .t{grid-area:title} .wrow .ph-w{grid-area:phase} .wrow .st-w{grid-area:status}
  .wrow .meta{grid-area:meta;text-align:left}
  .wrow .ph-w:not(:empty)::after{content:" ·"}
  /* With no phase, the status starts under the title, as the phase would. */
  .wrow .ph-w:empty{display:none} .wrow .ph-w:empty+.st-w{grid-column-start:phase}
}
@media (max-width:760px){
  .whatis{grid-template-columns:1fr;gap:0} .whatis dd{margin-bottom:var(--space-3)}
}

.context{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:var(--text-small)}
.context dt{color:var(--color-text-muted)}
.context dd{margin:0;min-width:0}

/* sections and rows */
section>h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-5)}
section>h2 .sub{font-size:var(--text-small);font-weight:400;color:var(--color-text-muted)}
.rows{border-top:1px solid var(--color-line)}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) 104px minmax(0,1.35fr);gap:4px 16px;padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-line);align-items:start}
.row.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1.49fr)}
.issue a{color:var(--color-text);text-decoration:none;display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 8px}
.issue a:hover .t{text-decoration:underline}
.issue .k{font-family:var(--font-mono);font-size:var(--text-mono);color:var(--color-text-muted);padding-top:2px}
.issue .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.phase{font-size:var(--text-small);color:var(--color-text-muted);padding-top:1px}
.now .doing{min-width:0}
.follow{display:inline;font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--color-line);text-underline-offset:3px}
.follow:hover{text-decoration-color:var(--color-accent)}
.now .last{font-size:var(--text-small);color:var(--color-text-muted);margin-top:2px}
.dur{color:var(--color-text-muted);white-space:nowrap}
.need{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-line);align-items:center}
.need .ask{font-weight:600;color:var(--color-text)}
.need .about{font-size:var(--text-small);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:var(--text-small);border-radius:var(--radius-control);padding:7px 12px;cursor:pointer;text-decoration:none;border:1px solid var(--color-field-border);background:var(--color-bg);color:var(--color-text);white-space:nowrap}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--color-accent);padding:4px 6px}
.btn[disabled],.btn.primary[disabled]{background:transparent;border-color:var(--color-line);color:var(--color-text-muted);cursor:not-allowed}
.secret .reveal:hover{color:var(--color-text)}
.secret{position:relative;display:block;margin-top:6px}
.field .secret input[type=password],.field .secret input[type=text]{margin-top:0;padding-right:44px}
.secret .reveal{position:absolute;top:0;bottom:0;right:4px;margin:auto 0;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:0;background:transparent;color:var(--color-text-muted);cursor:pointer;border-radius:var(--radius-control)}
fieldset.field{border:0;padding:0;margin-left:0;margin-right:0;min-width:0}
fieldset.field>legend{padding:0;font-weight:600;font-size:var(--text-small)}
.secret .reveal:focus-visible{outline-offset:-3px}
.choice-more{padding-left:24px;margin:-2px 0 var(--space-4)}
.choice-more:last-child{margin-bottom:0}
.choice-more>.field:first-child{margin-top:var(--space-2)}
.opt{font-weight:400}
.stepper{list-style:none;margin:var(--space-2) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 24px;font-size:var(--text-small)}
.setup>.su-block{margin-top:var(--space-5);border-top:1px solid var(--color-line);padding-top:var(--space-5)}
.setup>.actions{margin-top:var(--space-6)}
.setup .su-form>.actions{margin-top:var(--space-6)}
.setup .err-summary{margin-top:var(--space-6)}
.setup .err-summary:not([hidden])+.actions{margin-top:var(--space-3)}
.su-block>h3+p{margin-top:4px}
.su-status{margin-top:var(--space-3);min-height:calc(var(--text-small) * 1.6)}
/* The result's line is kept while a block has none, so a check starting as a field is left moves nothing below it. */
.err-summary{border:1px solid var(--color-line);border-left:4px solid var(--color-fail);background:var(--color-raised);border-radius:var(--radius-control);padding:var(--space-3) var(--space-4)}
.err-summary .es-t{font-size:var(--text-small);font-weight:600}
.err-summary ul{margin:6px 0 0;padding-left:18px;font-size:var(--text-small)}

/* ------------------------------------------------------------------ data
   One fictional sprint, run forward from 10:02 to 14:20 by the factory's rules:
   at most 3 issues under way; an issue starts when its in-sprint dependencies merged
   and a place is free; Small skips design; Large adds the PRD; a new screen adds a prototype. */
const NOW = '14:20';
const SLACK = 'https://example.slack.com/archives/C0123456789/p1795424389';
const CL = {cli:'Claude Code', model:'claude-opus-5-5', effort:'high'};
const CX = {cli:'Codex', model:'gpt-6-luna', effort:'max'};
const CR = {cli:'Codex', model:'gpt-6.1-sol', effort:'high'};
const GOAL = {text:'Shoppers find and buy the right product without having to ask support.'};
const SPRINT = {purpose:'Shoppers can find a product by what it does, not only by its name.', started:'Nov 23, 10:02',
  krs:['A search for what a product does returns that product on the first page of results.','Fewer than 1 in 20 searches return nothing.']};

function run(base, cost, said){ return Object.assign({}, base, {cost, said}); }

const ISSUES = {
 'ACME-141':{title:'Search products by their attributes', size:'Medium', sizeWhy:'One outcome; touches the search index, the query and the API; no new screen.',
  outcome:'A shopper who searches for what a product does (such as "waterproof") finds products with that attribute.',
  nonGoals:['Changing how results are ranked','A new results page (ACME-142)'], pr:null,
  phases:[
   {name:'Requirements', state:'done', span:'10:03–10:09', steps:[
     {who:'Lead', text:'Read the issue and judged it Medium', res:'Medium', s:'10:03', e:'10:09', run:run(CL,0.42,'Outcome settled: attribute words in a search match product attributes. Medium: the index, the query and the API change; no screen.')}]},
   {name:'Design', state:'done', span:'10:09–11:43', steps:[
     {who:'Lead', text:'Read the code', res:'done', s:'10:09', e:'10:16', run:run(CL,0.38,'Search is a single SQL LIKE over names; attributes live in product_attributes.')},
     {who:'Lead', text:'Decided which documents it needs', res:'Design Doc only', s:'10:16', e:'10:18', run:run(CL,0.09,'No screen and no decision for you: a Design Doc is enough.')},
     {who:'Lead', text:'Wrote the design', res:'done', s:'10:18', e:'10:41', run:run(CL,1.12,'docs/design/attribute-search.md written.')},

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mins(from, to=NOW){ const p=t=>{const [h,m]=t.split(':').map(Number);return h*60+m}; return p(to)-p(from); }
/* "3 min", "2 h", "2 h 5 min". */
function span(m){ m=Math.max(1,m); return m<60 ? `${m} min` : (m%60===0 ? `${Math.floor(m/60)} h` : `${Math.floor(m/60)} h ${m%60} min`); }
function ago(t){ return span(mins(t)); }
function why(text){ return `<div class="why" role="note"><b>Why this is here:</b> ${text}</div>`; }
function ext(href, label){ return `<a href="${href}" target="_blank" rel="noopener">${label}<span aria-hidden="true"> ↗</span><span class="sr"> (opens in a new tab)</span></a>`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3600); }
/* "22 runs. $3.14 for the 8 on Claude Code; 14 on Codex report no cost." */
function runsCost(steps){
  const runs=steps.filter(s=>s.run), ended=runs.filter(s=>!s.now), running=runs.length-ended.length;
  const byCli=rows=>[...new Set(rows.map(r=>r.run.cli))].map(cli=>`${rows.filter(r=>r.run.cli===cli).length} on ${cli}`).join(' and ');
  const costed=ended.filter(s=>s.run.cost!=null), uncosted=ended.filter(s=>s.run.cost==null);
  const spent=costed.reduce((sum,s)=>sum+s.run.cost,0);
  const parts=[costed.length?`$${spent.toFixed(2)} for the ${byCli(costed)}`:'', uncosted.length?`${byCli(uncosted)} report no cost`:''].filter(Boolean);
  const count=`${runs.length} run${runs.length===1?'':'s'}${running?`, ${running} running`:''}.`;
  return parts.length?`${count} ${parts.join('; ')}.`:count;
}

  ${why('<b>Answers:</b> how far the sprint has come, and what it is for. The goal it serves is in the band above, on every screen: everything the factory chooses is measured against it.')}`;
  const row = (k, title, phase, status, meta, cls='') => `<div class="wrow ${cls}"><span class="k">${k?`<a href="#/issue/${k}">${k}</a>`:''}</span><span class="t">${k?`<a href="#/issue/${k}">${esc(title)}</a>`:esc(title)}</span><span class="ph-w">${phase}</span><span class="st-w">${status}</span><span class="meta">${meta}</span></div>`;
  if (s.needs.length) {
    h += `<section class="grp" aria-labelledby="h-you"><h2 id="h-you">Waiting for you</h2>
    <div class="list">${s.needs.map(n=>row(n.about, n.title, '', n.delivered?`<a class="yours" href="${n.href||SLACK}" target="_blank" rel="noopener"><span aria-hidden="true">● </span>${n.ask}<span aria-hidden="true"> ↗</span><span class="sr"> ${n.where||'in Slack'} (opens in a new tab)</span></a>`:`<span class="muted">${n.ask} · not in Slack yet</span>`, '')).join('')}</div>
    ${why('<b>Answers:</b> is anything mine, and what. The action opens it in Slack. ● goes with "yours" and nothing else.')}</section>`;
  }
  if (!s.sprint) return h + '</div>';
  const by = sec => ORDER.filter(k=>s.issues[k].now.section===sec);
  const prog = by('progress'), q = by('queued'), done = by('done');
  h += `<section class="grp" aria-labelledby="h-prog"><h2 id="h-prog">In progress</h2>
   <div class="list">${prog.length?prog.map(k=>{ const n=s.issues[k].now; const cur = allSteps(ISSUES[k]).find(x=>x.now&&x.run&&!n.held); const id = cur?RUNS.push(cur)-1:null;
     const act = n.held?'<span class="muted">On hold (paused)</span>':(n.problem?`<span class="fail"><span aria-hidden="true">▲ </span>${esc(n.act)}</span>`:esc(n.act));
     return row(k, s.issues[k].title, n.phase, cur&&!n.problem?`<button class="follow" onclick="openRun(${id})">${act}</button>`:act, ago(n.since)); }).join(''):'<div class="empty">Nothing is in progress.</div>'}</div>
   ${why('<b>Answers:</b> where each issue is and what is happening, in a fixed set of short words (five phases; one activity list), with the time it has been in that activity. ▲ goes with a problem the lead is handling and nothing else. Click an activity to read what the agent is saying. <b>Without it:</b> you go back to the logs.')}</section>`;
  if (q.length) h += `<section class="grp" aria-labelledby="h-q"><h2 id="h-q">Waiting to start</h2>
   <div class="list">${q.map(k=>row(k, s.issues[k].title, '', `<span class="muted">${s.issues[k].now.short}</span>`, '')).join('')}</div>
   ${why('<b>Answers:</b> why it has not started: an issue it depends on, or the limit on issues at once (the issue page names the issues under way). No time: waiting here is not a problem.')}</section>`;
  h += `<section class="grp" aria-labelledby="h-d"><h2 id="h-d">Done</h2>
   <div class="list">${done.length?done.map(k=>{const n=s.issues[k].now; return row(k, s.issues[k].title, '', n.short==='Merged'?n.short:`<span class="muted">${n.short}</span>`, n.at);}).join(''):'<div class="empty">No issue has ended yet.</div>'}</div>
   ${why('<b>Answers:</b> how each settled issue ended and when (a clock time, where in progress shows a duration; with its date, such as "Nov 20, 21:00", when it ended on an earlier day, since a sprint spans days). Closed and held stay listed.')}</section>`;
  return h + '</div>';
}
function doneCount(s){ return ORDER.filter(k=>s.issues[k].now.section==='done').length; }

/* ---- issue */
function viewIssue(key){
  const s = situation(); const i = s.issues[key]; if(!i) return `<p>No such issue. <a href="#/now">Back to Now</a></p>`;
  const st = allSteps(i); const n = i.now;
  const cur = st.find(x=>x.now&&x.run&&!n.held); const cid = cur?RUNS.push(cur)-1:null;
  let nowText;
  /* In progress: the agent at work and what it is doing, or the activity alone when no agent is. */
  if (n.section==='progress' && n.problem) nowText = `<span class="fail">The lead is handling a problem: ${esc(n.problem)}</span>`;
  else if (n.section==='progress') nowText = `${cur?`<b>${cur.who}</b> is ${esc(lc(n.act))}`:esc(n.act)}${n.held?'<span class="muted"> · on hold while the factory is paused</span>':`<span class="muted"> · for ${ago(n.since)}</span>`}${cur?` <button class="run" onclick="openRun(${cid})">follow</button>`:''}`;
  else if (n.section==='you') { const nd=s.needs.find(x=>x.about===key); nowText = `<b class="accent">Waiting for you: ${nd?nd.ask:'your answer'}</b> ${nd&&nd.href?ext(nd.href,'Open the pull request'):ext(SLACK,'Answer in Slack')}`; }
  else if (n.section==='queued') nowText = n.why+'.';
  else nowText = `${n.text} at ${n.at}.`;
  return `${lostNote()}<p class="crumbs"><a href="#/now">Now</a> / ${key}</p>
  <div class="ihead"><h1>${esc(i.title)}</h1></div>
  <div class="links">${ext('https://linear.app/acme/issue/'+key,'Linear issue')}${i.pr?ext(i.pr,'Pull request #'+i.pr.split('/').pop()):'<span class="muted">No pull request yet</span>'}${i.prototype?`<a href="#/prototype/${key}">Prototype</a>`:''}</div>
  <p class="inow">${nowText}</p>
  ${why('<b>Answers:</b> where this issue is now, in a sentence that names who acts. <b>Without it:</b> you go back to Now to find out.')}
  <div class="region">
  <section class="grp" aria-labelledby="h-path"><h2 id="h-path">Path</h2>
   ${why('<b>Answers:</b> how far along it is and what is ahead, by the five phases every issue shares. First on this page because you come here most often from Now, wanting to know where it is.')}
   <ol class="path">${i.phases.map(p=>phaseItem(p, n)).join('')}</ol></section>
  <section class="grp" aria-labelledby="h-what"><h2 id="h-what">What it is</h2>
   <dl class="whatis">${i.outcome?`<dt>Outcome</dt><dd>${esc(i.outcome)}</dd>`:''}${i.nonGoals.length?`<dt>Not in it</dt><dd>${i.nonGoals.map(esc).join('<br>')}</dd>`:''}<dt>Size</dt><dd>${i.size?`<b>${i.size}</b>`:`<span class="muted">${i.now.section==='done'?'Not judged: the issue ended first.':'Judged when the lead reads the issue.'}</span>`}</dd></dl>
   ${why('<b>Answers:</b> what the issue is to deliver, what it leaves out, and how big the lead judged it, which decides its path.')}</section>
  <section class="grp" aria-labelledby="h-find"><h2 id="h-find">Review findings</h2>${findingsBlock(i)}</section>
  <section class="grp" aria-labelledby="h-runs"><h2 id="h-runs">Runs and cost</h2>
   ${st.some(x=>x.run)?`<p>${runsCost(st)}</p>
   <p class="links"><a href="#/activity" onclick="ACT_ISSUE='${key}'">See them in Activity</a></p>`:'<p>No runs yet.</p>'}
   ${dlPanel('issue:'+key, "this issue's records")}
   ${why('<b>Answers:</b> what this issue cost where it is known, and its records. A partial sum never stands alone as a total.')}</section>
  </div>`;
}
function runsOf(steps){ return (steps||[]).filter(s=>s.run); }
function phaseItem(p, n){
  const label = {done:`done · ${p.span}`, now:`now · ${p.span}`, ahead:'ahead', skipped:'skipped'}[p.state];
  let h = `<li class="ph ${p.state}"><div class="ph-h"><h3>${p.name}</h3><span class="st">${label}</span></div>`;
  if (p.desc && (p.state==='ahead'||p.state==='skipped')) h += `<p class="desc">${p.desc}</p>`;
  const steps = runsOf(p.steps).map(s=>Object.assign({phase:p.name},s));
  if (steps.length){
    const list = `<ul class="steplist">${steps.map(stepItem).join('')}</ul>`;
    if (p.state==='now') h += list;
    else h += `<details class="steps"><summary>${steps.length} run${steps.length>1?'s':''}</summary>${list}</details>`;
  }
  /* What comes next within the phase follows the activity under way; waiting on you or a problem has none. */
  if (p.state==='now' && p.ahead && n.section==='progress' && !n.problem) h += `<p class="desc">Next: ${p.ahead}</p>`;
  return h + '</li>';
}
let RUNS = [];
function stepItem(s){
  const id = RUNS.push(s)-1;
  const tm = s.now ? `${s.s}–` : (s.s?`${s.s}–${s.e}`:s.e);
  return `<li class="step${s.now?' current':''}"><span class="tm">${tm}</span><span>${sentence(s)}</span><span>${s.run?`<button class="run" onclick="openRun(${id})">${s.now?'follow':'open run'}</button>`:''}</span></li>`;
}
function lc(t){ return t.charAt(0).toLowerCase()+t.slice(1); }
function sentence(s){
  const res = s.now ? (s.you?'':` <span class="dur">· for ${ago(s.s)}</span>`) : (s.res&&s.res!=='done'?` <span class="${s.ok?'ok':s.fail?'fail':'muted'}">→ ${esc(s.res)}</span>`:'');
  return `<span class="who">${s.who}</span> ${esc(lc(s.text))}${res}`;
}
function findingsBlock(i){
  if(!i.findings.length) return '<p class="muted">No findings so far.</p>';
  const a=i.findings.filter(f=>f.disp==='applied').length, d=i.findings.filter(f=>f.disp==='declined').length, o=i.findings.length-a-d;
  const parts=[a&&`${a} applied`, d&&`${d} declined`, o&&`${o} being judged`].filter(Boolean).join(', ');
  return `<p>${i.findings.length} finding${i.findings.length===1?'':'s'}: ${parts}.</p>
  <details class="steps"><summary>Show each finding and its answer</summary>${i.findings.map(f=>`<div class="find"><span class="disp ${f.disp==='applied'?'ok':f.disp==='declined'?'muted':'accent'}">${f.disp||'being judged'}</span> <span class="muted small">· ${f.check}</span><div>${esc(f.text)}</div>${f.ans?`<div class="muted small">${esc(f.ans)}</div>`:''}</div>`).join('')}</details>`;
}
function openRun(id){
  const s = RUNS[id]; const r = s.run; const running = !!s.now;
  const dur = running ? `${ago(s.s)} so far` : span(mins(s.s,s.e));
  $('#drawer-panel').innerHTML = `<button class="btn quiet" onclick="closeRun()" style="float:right">Close</button>
   <p class="small muted">${s.phase||''} · run</p><h2 id="dr-title">${s.who} ${esc(lc(s.text))}</h2>
   <dl class="kv"><dt>Agent</dt><dd>${r.cli} · ${r.model} · effort ${r.effort}</dd><dt>Started</dt><dd>${s.s}</dd><dt>${running?'Running for':'Took'}</dt><dd>${dur}</dd>
   <dt>Result</dt><dd class="${s.ok?'ok':s.fail?'fail':''}">${running?'Running':(s.res&&s.res!=='done'?esc(s.res):'Done')}</dd>${r.failure?`<dt>Why</dt><dd>${esc(r.failure)}</dd>`:''}<dt>Cost</dt><dd>${r.cost!=null?'$'+r.cost.toFixed(2):(running?'Known when it ends':`Not reported: ${r.cli} does not report cost`)}</dd></dl>
   <h3 style="margin:18px 0 6px">${running?'What the agent has said so far':'What the agent said last'}</h3>
   ${r.said===null&&!running?'<p class="muted">The run ended before the agent said anything.</p>':running?`<ul class="msgs"><li><span>Reading the 4 findings and the change they are about.</span></li><li><span>The N+1 lookup and the SQL interpolation are real; checking whether the duplicated mapping is worth changing.</span></li><li><span>The empty-attribute test is covered by an existing case; preparing to decline it with that evidence.</span></li></ul>`:`<div class="said">${esc(r.said)}</div>`}
   <p style="margin-top:14px"><a href="#" onclick="openLog(${id});return false">Open the full log<span aria-hidden="true"> ↗</span><span class="sr"> (opens in a new tab)</span></a> <span class="small muted">: everything ${r.cli} printed during the run.</span></p>`;
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false'); $('#drawer-panel').querySelector('button').focus();
}
function openLog(id){
  const s=RUNS[id], r=s.run;
  const lines = r.cli==='Claude Code'
    ? [{type:'system',subtype:'init',model:r.model,session_id:'5c1f0a2e'},{type:'assistant',message:{content:[{type:'text',text:'Reading the item and its sources.'}]}},{type:'assistant',message:{content:[{type:'tool_use',name:'Read',input:{file_path:'src/search/query.ts'}}]}},{type:'user',message:{content:[{type:'tool_result',content:'(file contents)'}]}},{type:'assistant',message:{content:[{type:'text',text:r.said||'…'}]}}].concat(s.now?[]:[{type:'result',is_error:false,total_cost_usd:r.cost,usage:{input_tokens:48210,output_tokens:3120}}])
    : [{type:'thread.started',thread_id:'0199a1c2'},{type:'item.completed',item:{type:'reasoning',text:'Reading the item.'}},{type:'item.completed',item:{type:'command_execution',command:'rg -n attribute src/search',exit_code:0}},{type:'item.completed',item:{type:'agent_message',text:r.said||'…'}},{type:'turn.completed',usage:{input_tokens:61200,cached_input_tokens:40100,output_tokens:2810}}];
  const text = lines.map(l=>JSON.stringify(l)).join('\n');
  window.open(URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),'_blank','noopener');
}
function closeRun(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); }
$('#drawer').addEventListener('click', e=>{ if(e.target.id==='drawer') closeRun(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeRun(); });

/* ---- activity */
let ACT_ISSUE='all', ACT_SPRINT='cur';
function viewActivity(){
  RUNS = [];
  const ev = [];
  ORDER.forEach(k=>allSteps(ISSUES[k]).forEach(s=>{ if(s.run) ev.push(Object.assign({key:k},s)); }));
  ev.sort((a,b)=> (b.now?1:0)-(a.now?1:0) || (b.e||b.s).localeCompare(a.e||a.s));
  const shown = (ACT_SPRINT==='cur'||ACT_SPRINT==='all') ? ev.filter(e=>ACT_ISSUE==='all'||e.key===ACT_ISSUE) : [];
  const running = shown.filter(e=>e.now), past = shown.filter(e=>!e.now);
  const line = e => { const id = RUNS.push(e)-1; return `<div class="ev${e.now?' running':''}"><span class="tm">${e.now?e.s+'–':e.e}</span><span class="k"><a href="#/issue/${e.key}">${e.key}</a></span><span class="txt">${sentence(e)}</span><span class="res">${e.run?`<button class="run btn quiet" style="padding:0;font-size:var(--text-mono);text-decoration:underline" onclick="openRun(${id})">${e.now?'follow':'open run'}</button>`:''}</span></div>`; };
  return `${lostNote()}<div class="stack"><div><h1>Activity</h1><p class="muted" style="margin-top:4px">Every agent run in this sprint, newest first.</p></div>
  ${why('<b>Answers:</b> following the work as it happens: what is running, what just finished and with what result, what the agent said. This replaces reading raw logs; the raw log stays one click inside a run. <b>Without it:</b> the only way to follow the agents is the raw output.')}
  <div class="filters"><label>Sprint <select class="f" id="act-sprint"><option value="cur" ${ACT_SPRINT==='cur'?'selected':''}>This sprint: ${esc(SPRINT.purpose)}</option>${PAST.map(p=>`<option value="${p.id}" ${ACT_SPRINT===p.id?'selected':''}>${p.range}: ${esc(p.purpose)}</option>`).join('')}<option value="all" ${ACT_SPRINT==='all'?'selected':''}>All sprints</option></select></label>
   <label>Issue <select class="f" id="act-issue"><option value="all">All issues</option>${ORDER.map(k=>`<option value="${k}" ${ACT_ISSUE===k?'selected':''}>${k} ${esc(ISSUES[k].title)}</option>`).join('')}</select></label></div>
  <section class="grp" aria-labelledby="h-run"><h2 id="h-run">Under way</h2><div class="rows list">${running.length?running.map(line).join(''):'<div class="empty">Nothing is running for this filter.</div>'}</div></section>
  <section class="grp" aria-labelledby="h-past"><h2 id="h-past">Earlier</h2>${past.length?hours(past).map(([hr,evs])=>`<h3 class="subh hour">${hr}:00</h3><div class="rows list">${evs.map(line).join('')}</div>`).join(''):`<div class="empty">${ACT_SPRINT==='cur'||ACT_SPRINT==='all'?'Nothing has happened yet.':'(This prototype holds runs of the current sprint only.)'}</div>`}</section></div>`;
}

function hours(evs){ const out=[]; evs.forEach(e=>{ const h=(e.e||e.s).slice(0,2); if(!out.length||out[out.length-1][0]!==h) out.push([h,[]]); out[out.length-1][1].push(e); }); return out; }
/* ---- sprints and goal */
function viewSprints(){
  const s = situation(); const done = doneCount(s);
  return `${lostNote()}<h1>Sprints</h1>
  ${s.sprint?`<section class="grp" aria-labelledby="h-cur"><h2 id="h-cur">This sprint</h2>

   <dl class="kv">${sprintCost()}</dl>

   <p class="links"><a href="#/now">See the issues on Now</a><a href="#/activity">See its runs in Activity</a></p>
   ${dlPanel('sprint:20261123-1002', "this sprint's records")}</section>`:''}
  <section class="grp" aria-labelledby="h-past2"><h2 id="h-past2">Ended sprints</h2>

  <div class="list">${PAST.map(p=>`<details class="past"><summary><span class="muted small">${p.range}</span><span>${esc(p.purpose)}</span><span class="small">${p.met} of ${p.of} key results met</span></summary>
   <div class="body"><ul class="kr">${p.krs.map(k=>`<li><b class="${k.met?'ok':'fail'}">${k.met?'Met':'Not met'}</b> ${esc(k.t)}<div class="muted small">${esc(k.ev)}</div></li>`).join('')}</ul>
   <div class="facts"><span>${p.merged} merged</span><span>${p.dropped} dropped</span><span>${p.held} held</span></div>
   <div class="facts muted"><span>Working agreements changed: ${p.agreements.length?p.agreements.map(a=>'<code>'+a+'</code>').join(', '):'none'}</span><span>${p.runs} runs · ${p.cost}${p.uncosted?` (${p.uncosted} on a CLI that reports no cost)`:''}</span></div>
   ${dlPanel('sprint:'+p.id, "this sprint's records")}</div></details>`).join('')}</div></section>`;

function sprintCost(){
  const by={};
  ORDER.forEach(k=>allSteps(ISSUES[k]).forEach(st=>{ if(!st.run||st.now) return; const role=st.who; const b=by[role]=by[role]||{cli:st.run.cli,n:0,c:0,none:0}; b.n++; if(st.run.cost!=null) b.c+=st.run.cost; else b.none++; }));
  return ['Lead','Executor','Reviewer','Analyzer'].filter(r=>by[r]).map(r=>{const b=by[r]; return `<dt>${r}</dt><dd>${b.n} run${b.n===1?'':'s'} on ${b.cli} · ${b.none===b.n?'<span class="muted">no cost reported</span>':'$'+b.c.toFixed(2)}</dd>`;}).join('');
}

function bindGoal(){

  if (id==='slack'){ const e=$('#err-slack'); const ch=document.querySelector('#row-slack input'); if(!/^[CG][A-Z0-9]{8,}$/.test(ch.value.trim())){ e.textContent=`${ch.value} is not a channel ID; channel IDs start with C, such as C0123456789.`; return; } }
  if (id==='atonce'){ const v=document.querySelector('#row-atonce input').value.trim(); if(!/^\d+$/.test(v)){ $('#err-atonce').textContent='Enter a whole number.'; return; } if(+v===0){ $('#err-atonce').textContent='Enter 1 or more.'; return; } CFG.atOnce=+v; }
  if (id==='lang'){ CFG.lang=document.querySelector('#row-lang select').value; }
  if (id==='perm'){ CFG.perm=document.querySelector('#row-perm input[name=pm]:checked').parentElement.textContent.includes('Bypass')?'bypass':'auto'; }
  if (id.startsWith('role-')){ const k=id.slice(5), d=DRAFT, r=CFG.roles[k]; r.cli=d.cli; r.model=d.model.trim()||null; r.effort=d.effort.trim()||null; r.skills=[...document.querySelectorAll('#row-'+id+' .edit input[type=checkbox]:checked')].map(c=>c.value); r.append=document.querySelector('#row-'+id+' textarea').value.trim(); }
  if (id==='run'){
    const none = document.querySelectorAll('#row-run input[name=runs]')[1].checked;
    if (!none){
      if (!document.getElementById('app-start').value.trim()){ fieldError('app-start','Enter the command that starts the product.'); document.getElementById('app-start').focus(); return; }
      ['setup','start','ready'].forEach(k=>{ CFG.app[k]=document.getElementById('app-'+k).value.trim(); });
    }
    CFG.app.none=none; EDIT=null; render(); return; }
  EDIT=null; DRAFT=null; render();
}

/* ---- setup */
/* ---- setup
   Three steps, each ending in one decision, then the factory starts:
   1 Connect       facts about your tools, each checked where it is entered;
   2 Run the product  the lead finds how the product starts, the factory starts it once, you decide;
   3 Set the goal  your intent, and the start.
   A block is checked by connecting with its values once they are all entered; the result shows
   under the block, with what the service answered when it fails. Empty fields are pointed out only
   when you press Continue. Buttons stay enabled and answer with what is missing; only a running
   check disables one. The agent is chosen, not checked: a run that fails shows its own error. A change repaints its own region, never the page, so focus
   stays where it is. */
const SETUP_STEPS = ['Connect', 'Run the product', 'Set the goal'];
function setupHead(step){
  return `<div><h1>Set up Oven Spring for acme-shop</h1>
  <ol class="stepper" aria-label="Setup steps">${SETUP_STEPS.map((n,i)=>`<li ${step===i+1?'aria-current="step"':''}><span class="n">${i+1}</span>${n}${step>i+1?' <span class="ok" aria-hidden="true">✓</span><span class="sr"> (done)</span>':''}</li>`).join('')}</ol></div>`;
}
function setSit(v){ SIT=v; $('#sit').value=v; render(); }

/* -- shared field parts */
const EYE = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/><path d="M2.5 13.5l11-11"/></svg>';
/* One labelled field: label, help, control, and its error line. `control` gets the id, the
   descriptions and the handlers from `attrs`. */
function sfield(id, label, help, control){
  return `<div class="field"><label for="${id}">${label}</label>${help?`<span class="help" id="${id}-help">${help}</span>`:''}${control}<span class="err" id="${id}-err"></span></div>`;
}
const described = id => `aria-describedby="${id}-help ${id}-err"`;
function secretInput(id, label, attrs){
  return `<span class="secret"><input type="password" id="${id}" autocomplete="off" spellcheck="false" ${described(id)} ${attrs}><button type="button" class="reveal" aria-controls="${id}" aria-label="Show ${label}" aria-pressed="false" onclick="reveal(this,'${label}')">${EYE}</button></span>`;
}
function reveal(btn, label){ const i=document.getElementById(btn.getAttribute('aria-controls')), show=i.type==='password'; i.type=show?'text':'password'; btn.setAttribute('aria-pressed', String(show)); btn.setAttribute('aria-label', (show?'Hide ':'Show ')+label); btn.innerHTML = show?EYE_OFF:EYE; }
function fieldError(id, text){
  const err=document.getElementById(id+'-err'), el=document.getElementById(id);
  if (err) err.textContent = text || '';
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) { if (text) el.setAttribute('aria-invalid','true'); else el.removeAttribute('aria-invalid'); }
}
/* What is missing, above the button that was pressed: each item links to its field, and leaves the
   list once that field is filled in. */
function settled(boxId, id){
  const box=document.getElementById(boxId); if (!box || box.hidden) return;
  box.querySelectorAll(`a[href="#${id}"]`).forEach(a=>a.closest('li').remove());
  if (!box.querySelector('li')) { box.hidden=true; box.innerHTML=''; }
}
function summary(boxId, items){
  const box=document.getElementById(boxId);
  if (!items.length){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  box.innerHTML = `<h3 class="es-t">Before you continue</h3><ul>${items.map(([id,text])=>`<li><a href="#${id}" onclick="document.getElementById('${id}').focus();return false">${text}</a></li>`).join('')}</ul>`;
  box.focus();
}

/* -- step 1: connect */
const CLIS = [{k:'claude', name:'Claude Code'}, {k:'codex', name:'Codex'}, {k:'opencode', name:'OpenCode'}];
/* Each field: its block, and the message when it is left empty. A value is checked by connecting
   with it, not by its form: a wrong one fails the block's check. */
const SU_FIELDS = {
  base:{block:'github', empty:'Enter the base branch.'},
  token:{block:'github', optional:true},
  team:{block:'tracker', empty:'Enter the Linear team key.'},
  key:{block:'tracker', empty:'Enter the Linear API key.'},
  bot:{block:'slack', empty:'Enter the bot token.'},
  app:{block:'slack', empty:'Enter the app-level token.'},
  channel:{block:'slack', empty:'Enter the channel ID.'},
  member:{block:'slack', empty:'Enter your Slack member ID.'}};
const BLOCKS = {github:'GitHub', tracker:'Issues', slack:'Slack'};
function freshSU(){
  return {v:{base:'main', token:'', merge:'factory', tracker:'github', team:'', key:'', bot:'', app:'', channel:'', member:'', cli:null},
    github:{s:'ok', msg:githubMsg('','main')}, tracker:{s:'ok', msg:'This repository, 9 open issues.'}, slack:{s:null},
    seq:{}, wait:{}, checked:{github:'["github","main",""]', tracker:'["github"]'}, slackTries:0};
}
let SU = freshSU();
/* What the GitHub check answers: the account pull requests are opened as. */
function githubMsg(token, base){ return token ? 'Signed in as acme-factory-bot.' : 'Using the token of your signed-in gh, as mina.'; }
function fieldsOf(block){ return Object.keys(SU_FIELDS).filter(f=>SU_FIELDS[f].block===block && !(block==='tracker' && SU.v.tracker!=='linear')); }
/* The values a block's result is about; a result about other values is not shown. */
function snap(block){ return JSON.stringify(block==='tracker' ? [SU.v.tracker, ...fieldsOf(block).map(f=>SU.v[f])] : [block, ...fieldsOf(block).map(f=>SU.v[f])]); }
function complete(block){ return fieldsOf(block).every(f=>SU_FIELDS[f].optional || SU.v[f].trim()!==''); }
/* A remote check: the newest wins, so an answer about an older value is dropped. */
function check(block){
  const n=(SU.seq[block]||0)+1; SU.seq[block]=n; SU.checked[block]=snap(block);
  SU[block]={s:'checking'}; paintBlock(block);
  setTimeout(()=>{ if (SU.seq[block]!==n) return; SU[block]=answer(block); paintBlock(block); }, 800);
}
function answer(block){
  const v=SU.v;
  if (block==='github') return {s:'ok', msg:githubMsg(v.token, v.base)};
  if (block==='tracker') return v.tracker==='github' ? {s:'ok', msg:'This repository, 9 open issues.'} : {s:'ok', msg:`Team ${esc(v.team.trim())} (Acme), 9 open issues.`};
  SU.slackTries++;
  return SU.slackTries===1
    ? {s:'fail', msg:`The app is not in channel ${esc(v.channel)}; invite it there. <button type="button" class="btn quiet inline" onclick="check('slack')">Check again</button>`}
    : {s:'ok', msg:`Connected to channel ${esc(v.channel)}, as Mina.`};
}
function settle(block){
  clearTimeout(SU.wait[block]);
  if (!complete(block)) { SU.seq[block]=(SU.seq[block]||0)+1; SU.checked[block]=null; SU[block]={s:null}; paintBlock(block); }
  else if (SU.checked[block]!==snap(block)) check(block);
}
function suInput(id, value){
  SU.v[id]=value;
  const d=SU_FIELDS[id];
  if (value.trim()) { fieldError('su-'+id, ''); settled('su-summary', 'su-'+id); }
  if (SU.checked[d.block]!==snap(d.block) && SU[d.block].s) { SU.seq[d.block]=(SU.seq[d.block]||0)+1; SU[d.block]={s:null}; paintBlock(d.block); }
  clearTimeout(SU.wait[d.block]); SU.wait[d.block]=setTimeout(()=>settle(d.block), 700);
}
function suLeave(id){ settle(SU_FIELDS[id].block); }
function suTracker(kind){
  SU.v.tracker=kind; document.getElementById('su-linear').hidden = kind!=='linear';
  fieldsOf('tracker').forEach(f=>fieldError('su-'+f,'')); settle('tracker');
}
function blockStatus(block){
  const r=SU[block];
  if (!r || !r.s) return '';
  if (r.s==='checking') return `<p class="small"><span class="accent" aria-hidden="true">●</span> Checking…</p>`;
  return `<p class="small"><span class="${r.s==='ok'?'ok':'fail'}" aria-hidden="true">${r.s==='ok'?'✓':'✗'}</span> ${r.msg}</p>`;
}
function paintBlock(block){ const el=document.getElementById('st-'+block); if (el) el.innerHTML=blockStatus(block); }
function suAgent(k){ SU.v.cli=k; fieldError('su-agent',''); settled('su-summary', 'su-cli-'+CLIS[0].k); }
/* Continue: what is missing is listed; checks still answering are waited for, and setup goes on
   once they pass. */
function suContinue(){
  const items=[]; let pending=false;
  Object.keys(BLOCKS).forEach(block=>{
    let fieldIssue=false;
    fieldsOf(block).forEach(f=>{ const d=SU_FIELDS[f];
      if (!d.optional && !SU.v[f].trim()){ fieldError('su-'+f, d.empty); items.push(['su-'+f, `${BLOCKS[block]}: ${d.empty}`]); fieldIssue=true; } });
    if (fieldIssue) return;
    if (SU.checked[block]!==snap(block)) { check(block); pending=true; }
    else if (SU[block].s==='checking') pending=true;
    else if (SU[block].s==='fail') items.push([`st-${block}-anchor`, `${BLOCKS[block]}: the check failed.`]);
  });
  if (!SU.v.cli){ fieldError('su-agent','Choose the agent.'); items.push(['su-cli-'+CLIS[0].k,'Agents: choose the agent.']); }
  summary('su-summary', items);
  if (items.length) return;
  if (!pending){ stopFind(); setSit('setup-run'); startFind(); window.scrollTo(0,0); return; }
  const go=document.getElementById('su-go'); go.disabled=true; go.textContent='Checking…';
  const wait=setInterval(()=>{ if (Object.keys(BLOCKS).some(b=>SU[b].s==='checking')) return;
    clearInterval(wait); go.disabled=false; go.textContent='Continue'; suContinue(); }, 150);
}
function suFill(){
  const sample={bot:'xoxb-7012-acme', app:'xapp-1-A07ACME', channel:'C07ACMEFACT', member:'U01MINA0042'};
  Object.entries(sample).forEach(([k,val])=>{ SU.v[k]=val; const el=document.getElementById('su-'+k); if (el) el.value=val; fieldError('su-'+k,''); });
  settle('slack');
}
function suText(id, label, help, width){
  return sfield('su-'+id, label, help, `<input type="text" id="su-${id}" value="${esc(SU.v[id])}" spellcheck="false" ${described('su-'+id)} oninput="suInput('${id}',this.value)" onblur="suLeave('${id}')" ${width?`style="max-width:${width}"`:''}>`);
}
function suSecret(id, name, help, optional){
  return sfield('su-'+id, `${name}${optional?' <span class="muted opt">(optional)</span>':''}`, help, secretInput('su-'+id, name, `value="${esc(SU.v[id])}" oninput="suInput('${id}',this.value)" onblur="suLeave('${id}')"`));
}
const statusRegion = block => `<div class="su-status" id="st-${block}-anchor" tabindex="-1"><div id="st-${block}" aria-live="polite">${blockStatus(block)}</div></div>`;
function viewSetup(){

  return `<div class="stack setup" style="max-width:760px">${setupHead(1)}
  <div><h2>Connect</h2><p style="margin-top:6px">Each connection is checked once its values are in, and nothing is saved until all pass. Only <code>.ovenspring/config.toml</code> goes into the repository. Tokens stay outside it.</p></div>
  ${why('<b>Checked by connecting:</b> the repository when the page opens, the tracker and Slack once their values are complete, so a wrong value fails with what the service answered. The agent is not checked: it runs as set up on this computer, and a run that fails stops the factory with the agent\'s own error.')}
  <section class="su-block" aria-labelledby="su-h-github"><h3 id="su-h-github">GitHub</h3>
   <p class="small">This folder's <code>origin</code>: <b>github.com/acme/acme-shop</b></p>
   ${suText('base','Base branch','Issue branches start from it and merge into it.','240px')}
   <fieldset class="field"><legend>Who merges</legend><div class="choices">
    <label class="choice"><input type="radio" name="su-merge" ${v.merge==='factory'?'checked':''} onchange="SU.v.merge='factory'"><span><b>The factory</b></span><span class="note">Once checks and every approval are in.</span></label>
    <label class="choice"><input type="radio" name="su-merge" ${v.merge==='you'?'checked':''} onchange="SU.v.merge='you'"><span><b>You</b></span><span class="note">The factory tells you in Slack when a pull request is ready.</span></label></div></fieldset>
   ${suSecret('token','GitHub token','Leave empty to use the signed-in gh. Pull requests are opened as the token\'s account.',true)}
   ${statusRegion('github')}</section>
  <section class="su-block" aria-labelledby="su-h-tracker"><h3 id="su-h-tracker">Issues</h3>
   <p class="small">Where the factory takes its work from.</p>
   <fieldset class="field"><legend class="sr">Issue tracker</legend><div class="choices">

    <label class="choice"><input type="radio" name="su-tracker" ${v.tracker==='linear'?'checked':''} onchange="suTracker('linear')"><span><b>Linear</b></span><span class="note">A Linear team's Todo and In Progress issues, read with an API key.</span></label>

   ${suSecret('bot','Bot token','Starts with <code>xoxb-</code>.')}

/* -- step 2: run the product. The lead finds how it starts; the factory starts it once; you decide. */
const FOUND = {setup:'pnpm install --frozen-lockfile', start:'pnpm dev --port $PORT', ready:'http://localhost:$PORT/health'};
const LEAD_SAID = [
  'Reading README.md and package.json to see how the shop runs on a laptop.',
  'The dev script starts Next.js; it takes --port, so the start command passes $PORT.',
  'GET /health answers 200 once the server is up, so that is the ready check.',
  'pnpm-lock.yaml is committed, so the copy is prepared with pnpm install --frozen-lockfile.'];
let FIND = null, FIND_T = [], RUN = null, FIRST_RUN = false;
function stopFind(){ FIND_T.forEach(clearTimeout); FIND_T=[]; }
function startFind(){
  stopFind();
  FIND={said:[], stage:'reading', check:null};
  const at=(ms,f)=>FIND_T.push(setTimeout(()=>{ f(); if (SIT==='setup-run') paintFind(); }, ms));
  LEAD_SAID.forEach((m,n)=>at(900*(n+1), ()=>FIND.said.push(m)));
  at(4600, ()=>{ FIND.stage='checking'; FIND.check='prepare'; });
  at(6400, ()=>{ FIND.check='start'; });
  at(8200, ()=>{ stopFind(); setSit('setup-started'); });
}
function findProgress(f){
  const reading=f.stage==='reading';
  const mark=s=>s==='done'?'<span class="m ok" aria-hidden="true">✓</span>':s==='now'?'<span class="m accent" aria-hidden="true">●</span>':'<span class="m muted" aria-hidden="true">○</span>';
  return `<ol class="progress" aria-label="Progress">
    <li>${mark(reading?'now':'done')}<span>${reading?'<b>The lead is reading the repository</b>':'The lead found the commands'}</span></li>
    <li>${mark(reading?'wait':'now')}<span>${reading?'Start it once to check':'<b>Starting it once to check</b>'}</span>${reading?'':`<span class="sub"><code>${FOUND.start}</code>, waiting for <code>${FOUND.ready}</code> to answer</span>`}</li></ol>
   ${reading?`<section aria-labelledby="su-said"><h3 class="subh" id="su-said">What the lead has said so far</h3>
    ${f.said.length?`<ul class="msgs">${f.said.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:'<p class="small muted">Nothing yet.</p>'}</section>`:''}`;
}
function paintFind(){ const el=document.getElementById('su-find'); if (el) el.innerHTML=findProgress(FIND); }
function runIntro(){
  return `<div><h2>Run the product</h2>
  <p style="margin-top:6px">Each issue gets its own running copy of the product, for agents to check their changes and for you to preview. Confirm how it starts, or say there is nothing to run.</p></div>
  ${why('<b>Settled here, while you wait:</b> without it agents cannot check the running product and previews are refused, and nobody notices until a held merge. Waiting here means “not known yet” never reaches Now, and a failure is met before any work has begun. The lead\'s commands are checked by starting the product, not by you reading them.')}`;
}
/* The outcome the form opens on; RUN keeps what you did since. */
const OUTCOME = {'setup-started':'started','setup-nothing':'nothing','setup-failed':'failed'};
function runStatus(){
  if (RUN.edited) return '<p class="small muted">Changed. The factory starts it once when you continue.</p>';
  if (RUN.outcome==='started') return '<p class="small"><span class="ok" aria-hidden="true">✓</span> Started on port 4101 and answered after 1 min 12 s.</p>';
  if (RUN.outcome==='failed') return `<p class="small"><span class="fail" aria-hidden="true">✗</span> <b class="fail">Did not start.</b> Fix what it needs on this computer or change the commands, then Continue.</p>
   <pre class="out">the app did not answer http://localhost:4101/health within 120s; its log ends with:
▲ Next.js 15.2.0
- Local: http://localhost:4101
Error: connect ECONNREFUSED 127.0.0.1:5432
PrismaClientInitializationError: Can't reach database server at localhost:5432</pre>`;
  return '';
}
function runField(k, label, help, optional){
  const id='su-run-'+k, value=RUN.outcome==='nothing'?'':FOUND[k];

}
function runEdited(k, value){
