  document.getElementById('su-run-status').innerHTML=runStatus();
}
function runChoose(choice){ RUN.choice=choice; document.getElementById('su-cmds').hidden = choice!=='cmds'; }
function runsForm(){
  const nothingNote = RUN.outcome==='nothing' ? 'The lead\'s reading: <q>package.json has no start or dev script, and README.md describes the package as a library other projects install.</q> ' : '';
  return `<form class="su-form" onsubmit="runContinue();return false" novalidate aria-labelledby="su-run-q">
   <fieldset class="field"><legend id="su-run-q" class="sr">How the product runs</legend><div class="choices">
    <label class="choice"><input type="radio" name="su-runs" ${RUN.choice==='cmds'?'checked':''} onchange="runChoose('cmds')"><span><b>It runs with these commands</b></span></label>
    <div id="su-cmds" class="choice-more" ${RUN.choice==='cmds'?'':'hidden'}>
     <div id="su-run-status" aria-live="polite">${runStatus()}</div>
     ${runField('setup','Prepare','Runs before each start of a copy, such as installing its dependencies.',true)}
     ${runField('start','Start','Starts the product on <code>$PORT</code>.')}
     ${runField('ready','Ready when this answers','A URL that answers once the product is up, with the port as <code>$PORT</code>.')}</div>
    <label class="choice"><input type="radio" name="su-runs" ${RUN.choice==='none'?'checked':''} onchange="runChoose('none')"><span><b>There is nothing to run</b></span><span class="note">${nothingNote}Agents check their changes with the tests only, and Slack offers no preview.</span></label></div></fieldset>
   <div class="actions"><button type="submit" class="btn primary" id="su-run-go">Continue</button></div></form>`;
}
function runContinue(){
  const toGoal=()=>{ setSit('setup-goal'); window.scrollTo(0,0); };
  if (RUN.choice==='none') return toGoal();
  /* Only the start command is needed; its field says so. */
  if (!document.getElementById('su-run-start').value.trim()){ fieldError('su-run-start','Enter the command that starts the product.'); document.getElementById('su-run-start').focus(); return; }
  if (!RUN.edited && RUN.outcome==='started') return toGoal();
  const form=document.querySelector('.su-form');
  form.querySelectorAll('input,button').forEach(el=>{ el.disabled=true; });
  document.getElementById('su-run-status').innerHTML='<p class="small"><span class="accent" aria-hidden="true">●</span> <b>Starting it once to check</b> <span class="muted">· Prepare, then Start, then waiting for the ready address</span></p>';
  document.getElementById('su-run-go').textContent='Checking…';
  setTimeout(toGoal, 1800);
}
function viewSetupRun(){
  if (SIT==='setup-goal') return viewSetupGoal();
  const head=`<div class="stack setup" style="max-width:760px">${setupHead(2)}${runIntro()}`;
  if (SIT==='setup-run'){
    const f=FIND || {said:LEAD_SAID.slice(0,2), stage:'reading'};
    return `${head}<div id="su-find" aria-live="polite">${findProgress(f)}</div>
    <p class="small muted">This takes a few minutes. Closing this page does not stop it.</p></div>`;
  }
  /* The lead's agent failed to run: its error as the agent wrote it, and how the factory goes on. */
  if (SIT==='setup-stopped'){
    stopFind();
    return `${head}<div role="status"><p><span class="fail" aria-hidden="true">✗</span> <b class="fail">The lead's agent stopped with an error.</b> What it wrote:</p>
    <pre class="out">Codex: 401 Unauthorized. Your access token could not be refreshed; please log in again.</pre>
    <p class="small" style="margin-top:6px">The factory is paused. When it can run, resume with <kbd>@Oven Spring !resume</kbd> in Slack, and the lead reads the repository again.</p></div></div>`;
  }
  const outcome=OUTCOME[SIT];
  if (!RUN || RUN.outcome!==outcome) RUN={outcome, choice: outcome==='nothing'?'none':'cmds', edited:false};
  return `${head}${runsForm()}</div>`;
}
/* Settings › Running the product: the same choice, saved after the same check. */
function appEditor(nothing){
  return `<fieldset class="field"><legend class="sr">How the product runs</legend><div class="choices">
   <label class="choice"><input type="radio" name="runs" ${nothing?'':'checked'} onchange="$('#app-cmds').hidden=false"><span><b>It runs with these commands</b></span></label>
   <div id="app-cmds" class="choice-more" ${nothing?'hidden':''}>${EDITORS.app()}</div>
   <label class="choice"><input type="radio" name="runs" ${nothing?'checked':''} onchange="$('#app-cmds').hidden=true"><span><b>There is nothing to run</b></span><span class="note">Agents check their changes with the tests only, and Slack offers no preview.</span></label></div></fieldset>`;
}

/* -- step 3: set the goal, and start */
function viewSetupGoal(){
  return `<div class="stack setup" style="max-width:760px">${setupHead(3)}
  <div><h2>Set the goal</h2>
  <p style="margin-top:6px">Where the product is heading. When you start, the lead proposes the first sprint toward it in Slack. Nothing is worked on until you approve it there.</p></div>
  ${why('<b>Last, because it is what starts the factory.</b> Connecting and running the product are facts about your tools; the goal is your intent, and every sprint is proposed toward it. It stays in the band at the top of every screen, where you rewrite it later.')}
  <form class="su-form" onsubmit="goalStart();return false" novalidate>
   ${sfield('su-goal','Goal','As the state of the product or its users, in a sentence or two, not a list of work. For example: “Shoppers find and buy the right product without having to ask support.”',`<textarea class="prose" rows="3" id="su-goal" ${described('su-goal')} oninput="if(this.value.trim()) fieldError('su-goal','')"></textarea>`)}
   <div class="actions"><button type="submit" class="btn primary">Start</button></div></form></div>`;
}
function goalStart(){
  const text=document.getElementById('su-goal').value.trim();
  if (!text){ fieldError('su-goal','Enter the goal.'); document.getElementById('su-goal').focus(); return; }
  GOAL.text=text; FIRST_RUN=true; setSit('proposing'); location.hash='#/now';
}

/* ---- process page */
function viewProcess(){
  return `<div class="proc"><div><h1>How this was designed</h1><p style="margin-top:6px">In this order, each step's result checked by the next. The working notes behind each step are summarised here; nothing below was added after the screens were made.</p></div>
  <section><h2>1. What was set aside</h2><p>The earlier dashboards, their UI Spec and their prototypes were not opened. What was known of them from the earlier sessions was written down and not used as a starting point: a goal band on every screen, a status headline, "2 of 6 merged", one state word per issue row, stage dots or segmented tracks per row, grouping headings, a "Latest runs" panel, Settings tabs mirroring the configuration file, a six-column role table, a numbered explanation layer.</p></section>
  <section><h2>2. Facts used</h2><p>From the PRD, the Design Docs, the work plan and the backend code: the objects (factory, goal, sprint, issue, agent run, decision, finding, prerequisite, settings), their states (25 issue stages, 12 sprint stages), what the API returns and what it does not, and limits no design can remove: cost is known only for Claude Code runs; a running agent's messages exist only as raw output; OpenCode's sign-in cannot be read; decisions are made only in Slack.</p>
  <p style="margin-top:6px">And your own words from the earlier sessions: you read the logs because they were the only place showing what is happening now; a silent stop is fatal; dependencies and the parallel limit must be visible; one element, one meaning; changing the goal is heavy; Settings is the dashboard's own job; [app] commands should be collected by an agent; the lead should write to you in your language.</p></section>
  <section><h2>3. Situations and what success is</h2><div class="scroll"><table><tr><th>Situation</th><th>Your questions</th><th>Success</th><th>Where</th></tr>
   <tr><td>Glance (most often)</td><td>Moving? Anything mine? What is each piece doing now; did the last thing go well? How far?</td><td>Answered without a click; leave, or go to Slack</td><td>Now</td></tr>
   <tr><td>Unease</td><td>Stopped, waiting or working? On what, since when? Is someone on it?</td><td>Reassured with the reason, or know what to do and where</td><td>Now status line, rows</td></tr>
   <tr><td>Following the work</td><td>What runs now, what just finished, what did the agent say?</td><td>Follow without raw logs</td><td>Activity, run</td></tr>
   <tr><td>From Slack</td><td>What is this issue for, what was decided, how close will the build be to the prototype?</td><td>Enough to answer in Slack</td><td>Issue, Prototype</td></tr>
   <tr><td>Tuning</td><td>What does this change, when does it apply?</td><td>One change saved, its effect known</td><td>Settings</td></tr>
   <tr><td>Something broke</td><td>What is missing; the exact fix and where?</td><td>Fixed, seen resolved</td><td>Now status line → Settings or terminal</td></tr>
   <tr><td>Paused</td><td>Why; how to resume?</td><td>Resume in Slack after fixing the cause</td><td>Now status line</td></tr>
   <tr><td>Sprint end</td><td>What did it reach; what did it cost; records?</td><td>Understood; records downloaded</td><td>Sprints</td></tr>
   <tr><td>Direction change</td><td>What changes if I rewrite the goal?</td><td>Done deliberately</td><td>The goal band → Rewrite</td></tr>
   <tr><td>First start</td><td>Where does each value come from? Does it work? How will the product be run? What happens next?</td><td>Connected, the way the product runs settled, the goal set, and the factory started</td><td>Setup: Connect, Run the product, Set the goal</td></tr></table></div></section>
  <section><h2>4. Perspectives from similar tools</h2><ul style="margin:0;padding-left:18px">
   <li>Linear's agent sessions have a "stale" state for an agent that has gone quiet: being alive is its own state, apart from working. Here: stopped, out of reach and lost contact are never shown as working.</li>
   <li>GitHub's agent sessions make the session log the place to follow progress, with length and usage per session. Here: Activity and the run view, with the raw log one click further.</li>
   <li>Renovate's documentation warns that approvals kept in a dashboard are forgotten ("out of sight means out of mind") and keeps closed or ignored work visible. Here: decisions only link to Slack; dropped and held issues stay listed with why.</li></ul></section>
  <section><h2>5. Three frameworks compared</h2>
   <div class="minis">
    <div class="mini"><h3>A. One sentence, exceptions only</h3><div class="b">Working. Nothing needs you.</div><div class="b">Waiting for you (1)</div><div class="b">[Show the work]</div></div>
    <div class="mini"><h3>B. Activity stream first</h3><div class="b">Working</div><div class="b">Waiting for you (1)</div><div class="b">Latest: 14:16 pushed · 14:14 3 findings · …</div></div>
    <div class="mini chosen"><h3>C. Work by who has it (chosen)</h3><div class="b">Working</div><div class="b">Waiting for you</div><div class="b">In progress: who · what · for how long · last result</div><div class="b">Waiting to start: why</div><div class="b">Done: how it ended</div></div></div>
   <div class="scroll" style="margin-top:10px"><table><tr><th></th><th>A</th><th>B</th><th>C</th></tr>
    <tr><td>What each piece does now, at a glance</td><td>One click away</td><td>Only pieces that just produced an event</td><td>Every issue, once</td></tr>
    <tr><td>Stuck or waiting, on what, since when</td><td>Not on the first screen</td><td><b>Fails:</b> stuck work produces no events, so the stream hides exactly it</td><td>Wait reason and time in the activity, per issue</td></tr>
    <tr><td>Follow the work</td><td>Other screen</td><td>Yes</td><td>Last result per issue; full stream on Activity</td></tr>
    <tr><td>Same fact in two places</td><td>No</td><td>An issue is in Running and Latest</td><td>No</td></tr></table></div>
   <p style="margin-top:6px">C was chosen; B's strength became the Activity screen. Settings: grouping by the configuration file (makes you translate your task into file sections) and one page per role (scatters factory-wide settings) were compared with grouping by what you come to do, which was chosen.</p></section>
  <section><h2>6. Rules every screen follows</h2>
   <h3 class="subh" style="padding:0">Two layers, two ways of writing</h3>
   <p>Changed after you found Now too wordy to glance at. One way of writing had been used for every screen.</p>
   <ol style="margin:6px 0 0;padding-left:20px">
   <li><b>Glance layer (Now):</b> position, a fixed set of short words and numbers. Five phases (Requirements, Design, Build, Review, Merge) and one list of activities of three words or fewer (Reading the issue, Writing the design, Task 2 of 3, Judging findings, Waiting for CI, …). No sentences, no explanations.</li>
   <li><b>Marks go with their word, only where attention is needed:</b> ● with what is yours, ▲ with a problem the lead is handling. Earlier rule "no mark that repeats a word" mixed up saying a fact twice in two places (bad) with pairing a mark and its word in one place (helps the eye find it).</li>
   <li><b>Read layer (Issue, Activity, a run, Settings, Setup):</b> sentences, naming who acts.</li>
   <li><b>Time by format:</b> a duration ("3 min") is how long an issue has been in its current activity; a clock time ("12:48") is when it ended. Waiting for you and waiting to start show none: neither tells you to do anything different.</li></ol>
   <h3 class="subh" style="padding:0">Groups you can see</h3>
   <p>Changed after you found the issue page pouring everything in at once. Spacing had no hierarchy: the gap between items, between groups and under a heading were about the same, and every line weighed the same.</p>
   <ol style="margin:6px 0 0;padding-left:20px">
   <li>Distances step up and never overlap: inside an item 4–8 px; between items 12 px with a hairline; heading to its list 24 px; between subgroups 24 px; between groups 40 px; between page regions 64 px.</li>
   <li>Hairlines only between items of a list, never around or between groups.</li>
   <li>Heading sizes step up: subgroup 17, group 22, page 30, the factory's state 32. A heading is always bigger than anything in its group.</li>
   <li>A group heading starts at the edge; everything in the group, list or not, starts 8 px in.</li>
   <li>Read pages are one column, ordered by the reason you most often come: the issue page is Now, Path, What it is, Review findings, Runs and cost.</li></ol>
   <h3 class="subh" style="padding:0">The goal is always in view</h3>
   <p>Every screen shows the product goal in the same band under the header, with Rewrite next to it. This is the product's core, not a layout choice: the factory chooses issues, judges how far to take each one and proposes every sprint against the goal, so the owner keeps it in mind wherever they are. (Taking it off Now in an earlier revision, as rarely changing, was wrong for that reason.)</p>
   <h3 class="subh" style="padding:0">Kept from before</h3>
   <ol style="margin:6px 0 0;padding-left:20px">
   <li>One fact, one place per screen.</li>
   <li>Decisions are never made here: every one opens in Slack. Commands say where to run them.</li>
   <li>A cost is never shown without what it covers.</li>
   <li>Heavy changes get their own page with their consequences; settings change one row at a time.</li>
   <li>One signal per state; rounded corners only on buttons and fields; code in the mono face; colours, sizes and spaces from the dashboard's tokens.</li>
   <li>External links open in a new tab and say so; every list says when it is empty.</li></ol></section>
  <section><h2>7. Checked before handing over</h2><p>Each key path walked step by step with four questions: will you want to do this step, notice where, understand that the control does it, and see that it worked. A "no" fails the step. Results:</p>
   <div class="scroll"><table id="walk"><tr><th>Path</th><th>Result</th></tr>${WALK.map(w=>`<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('')}</table></div>
   <p style="margin-top:10px">Then every screen was looked at as components, at 1280 and 390 px, light and dark. Found and fixed: the issue page said "waiting for you" three times and the phase twice; the rows of Waiting to start and Done began their text on a different line from In progress; on a phone, second lines began at the left edge; Activity scrolled sideways at 390 px; read-only rows were labelled "Fixed"; the held-paths explanation was repeated in five rows; OpenCode's effort was described as a flag it does not have; the status line said "3 issues under way" while two rows were in progress.</p></section>
  <section><h2>8. Against the code: what the backend needs, and what it can drop</h2>
   <p>Compared with the dashboard and the API in the repository. Each item is kept only when a situation in 3 needs it for what the owner is there to do; how it is built is chosen for maintenance, not for the smallest change to today's code.</p>
   <h3 class="subh" style="padding:0">Brought in from the old dashboard</h3>
   <ul class="plain" style="padding-left:18px">
   <li>An empty goal: "No goal yet. The factory proposes no sprint until there is one." with Set the goal.</li>
   <li>A configuration file that cannot be used. The old screen said "no work starts"; a running daemon in fact goes on with the last configuration it read without an error (it logs <code>config-refused</code>), and starts no work only when it starts with a broken file. The status says what is true.</li>
   <li>Several missing prerequisites at once, each with its fix and the setting that fixes it.</li>
   <li>What a download holds, that secrets are masked, and its preparing and failed states.</li>
   <li>A run that failed and why.</li>
   <li>The Activity sprint filter with ended sprints and All sprints.</li>
   <li>Setup: a failed connection check said where that connection is entered.</li>
   <li>Kept for the build, not drawn here: "Fill this in." on empty setup fields; an allowed MCP server that is no longer defined; "This run could not be read".</li></ul>
   <h3 class="subh" style="padding:0">Backend work this design needs</h3>
   <div class="scroll"><table><tr><th>What</th><th>Why the owner needs it</th><th>Built as</th></tr>
   <tr><td>Each issue's phase, activity, when it entered it, and a problem flag</td><td>Glance: what each piece of work is doing (what the owner read the logs for)</td><td>Phase is an attribute of the step type in Rust; the API returns phase and activity as codes; the dashboard words them</td></tr>
   <tr><td>Why a queued issue has not started (an issue it depends on, or the limit and the issues holding it)</td><td>"I need to know what it depends on"</td><td>The scheduler's own reason, returned by the backend, not recomputed in the dashboard</td></tr>
   <tr><td>The sprint's stage, and a service out of reach since when</td><td>A silent stop is fatal; Working during the sprint review is wrong</td><td>Part of the overview's status</td></tr>
   <tr><td>Each decision's kind</td><td>Glance: what is asked of me</td><td>Returned from the decision record</td></tr>
   <tr><td>The issue's size, and the evidence it was judged from</td><td>Its path depends on it; the owner has asked why an issue was Medium</td><td>Scale from the issue state; the reason from the requirements output's <code>costEvidence.drivers</code> (no prompt change)</td></tr>
   <tr><td>The issue's path: phases done, now and ahead, with the runs in each</td><td>How far along, what remains</td><td>Built by the backend from the flow's route for the size and the issue's runs</td></tr>
   <tr><td>Each run's cost</td><td>Tuning roles by cost</td><td>In the runs list; the dashboard sums by role</td></tr>
   <tr><td>A running agent's messages</td><td>Following the work without raw logs</td><td>Read from the run's output stream</td></tr>
   <tr><td>Claude Code's and Codex's effort levels as fixed lists</td><td>Choosing effort without looking values up</td><td>In the dashboard (Codex: the levels every model offers; ultra on request later)</td></tr></table></div>
   <p class="small muted" style="margin-top:6px">Asked for, but waiting on a prompt change that this round leaves alone: the lead finding the product's commands (setup's second step), and the language of messages to the owner.</p>
   <h3 class="subh" style="padding:0">What the API returns that nothing here uses (to remove)</h3>
   <ul class="plain" style="padding-left:18px">
   <li><code>status.last_merge_at</code>; <code>status.state = waiting</code> (what waits for you is its own list).</li>
   <li>State words built on the server (<code>issues[].state</code>, <code>kind</code>, <code>IssueDetail.progress</code>) and <code>now</code>'s raw step, round and role: replaced by phase, activity and the path.</li>
   <li><code>sprint.merged</code> alone (the screen counts everything that ended), the <code>return</code> finding disposition, and the <code>headline</code> text token.</li></ul></section></div>`;
}
let WALK = [
 ['Glance: is it moving, is anything mine, what is each piece doing, how far','Pass. Status line, Waiting for you, In progress rows and the sprint line answer all four without a click.'],
 ['Answer a decision','Pass. The row says what is asked about which issue and how long ago; "Answer in Slack" opens Slack in a new tab.'],
 ['Why has ACME-147 not started?','Pass. The reason names the three issues under way and links the limit in Settings.'],
 ['Follow what an agent is doing (what you read the logs for)','<b class="fail">Failed in the first build:</b> it took Now → issue → follow, and nothing on Now showed the way. Fixed: what an agent is doing on Now opens its run. Pass after the fix.'],
 ['A stop only you can resolve','Pass. Listed under Waiting for you with what failed; the button goes to Slack, where Resolved is.'],
 ['Codex is signed out','Pass. The status line names the roles that wait, the command, and where to run it.'],
 ['Paused','Pass. Cause, since when, and the resume command with where to send it.'],
 ['Change the executor\'s model','Pass. The field says what empty means; after saving, the value shows and the note says it applies from the next run.'],
 ['Move a role to another agent CLI','Pass. Model and effort for the old CLI are cleared with a note; skills not in the new CLI\'s folder are unchecked with a note; OpenCode\'s missing guard hooks are stated before saving.'],
 ['Rewrite the goal','Pass. The band on every screen leads there; consequences are shown before saving; Save works only after a change.'],
 ['Enter a wrong Slack channel ID','Pass. Refused with the reason; nothing saved.'],
 ['First start','Pass. Each connection is checked where it is entered, and a failure says why in that block; the way the product runs is settled by starting it before any work begins; the goal is set last, and Start begins the first sprint proposal.'],
 ['Arrive from the prototype approval in Slack','Pass. What is approved, how closely the build follows it, and that the approval itself is in Slack.'],
 ['Get a sprint\'s records','Pass. Each sprint has its download.'],
 ['See what the running sprint costs, and which role spends it (to decide what to change)','<b class="fail">Missed in the first two builds:</b> cost was only on each issue, each run and ended sprints, so the tuning situation had no place to start from. Added: cost so far by role on the running sprint, with what it covers and a link to change the role. Pass after the fix.'],
 ['Open a run\'s full log','<b class="fail">Missed:</b> the link went nowhere in the prototype. Now it opens the raw output in a new tab, as the API\'s log endpoint serves it.']
];

/* ------------------------------------------------------------------ router */
function dl(scope){ toast(`Downloading ovenspring-${scope.replace(':','-')}.jsonl (secrets masked).`); }
function dlPanel(scope, label){
  return `<details class="steps dl"><summary>Download ${label}</summary>
   <p class="small" style="margin-top:var(--space-2)">One JSONL file of every record, for an agent to read or for an audit. Secrets are masked.</p>
   <div class="actions"><button class="btn" onclick="dlRun(this,'${scope}')">Download (.jsonl)</button><span class="small muted dl-state" role="status"></span></div></details>`;
}
function dlRun(btn, scope){ const st=btn.parentElement.querySelector('.dl-state'); btn.disabled=true; st.textContent='Preparing…'; setTimeout(()=>{ btn.disabled=false; st.textContent=''; dl(scope); },600); }
function goalBand(){
  return `<div class="gb-in"><span class="gb-l">Goal</span><p class="gb-t">${esc(GOAL.text)}</p><a class="gb-a" href="#/goal">Rewrite…</a></div>`;
}
function render(){
  RUNS = [];
  const h = location.hash || '#/now';
  const [, page, arg] = h.split('/');
  document.querySelectorAll('[data-nav]').forEach(a=>a.removeAttribute('aria-current'));
  const navKey = page==='issue'||page==='prototype'?'now':page;
  const cur = document.querySelector(`[data-nav="${navKey}"]`); if(cur) cur.setAttribute('aria-current','page');
  /* Before setup is saved, the header shows only the wordmark and the version. */
  document.querySelectorAll('[data-nav-only]').forEach(el=>{ el.hidden = SIT.startsWith('setup') && page!=='process'; });
  const band = document.getElementById('goalband'); band.style.display = (SIT.startsWith('setup') || page==='process') ? 'none' : ''; band.innerHTML = goalBand();
  let html;
  switch(page){
    case 'issue': html=viewIssue(arg); break;
    case 'activity': html=viewActivity(); break;
    case 'sprints': html=viewSprints(); break;
    case 'goal': html=viewGoal(); break;
    case 'settings': html=viewSettings(arg||'connections'); break;
    case 'prototype': html=viewPrototype(arg); break;
    case 'process': html=viewProcess(); break;
    default: html=viewNow();
  }
  if (SIT.startsWith('setup') && page!=='process') html = viewSetup();
  document.getElementById('su-fill').hidden = !(SIT==='setup' && page!=='process');
  $('#app').innerHTML = html;
  if (page==='goal' && !SIT.startsWith('setup')) bindGoal();
  const ai = $('#act-issue'); if(ai) ai.addEventListener('change',e=>{ACT_ISSUE=e.target.value;render();});
  const as = $('#act-sprint'); if(as) as.addEventListener('change',e=>{ACT_SPRINT=e.target.value;ACT_ISSUE='all';render();});
}
let lastPage=null;
window.addEventListener('hashchange',()=>{ DISCARDED = (EDIT && EDIT_TYPED && location.hash.startsWith('#/settings/')) ? editName() : null; if(EDIT){ EDIT=null; DRAFT=null; EDIT_TYPED=false; } closeRun(); render(); $('#app').focus({preventScroll:true}); window.scrollTo(0,0); });
$('#sit').addEventListener('change',e=>{ SIT=e.target.value; FIRST_RUN=false; EDIT=null; stopFind(); FIND=null; RUN=null; if(SIT==='setup') SU=freshSU(); if(SIT.startsWith('setup')) location.hash='#/now'; if(SIT==='setup-run') startFind(); render(); });
$('#explain').addEventListener('change',e=>document.body.classList.toggle('explain',e.target.checked));
const th=$('#theme'); try{ th.value=localStorage.getItem('os-theme')||'auto'; }catch(e){}
function applyTheme(){ const v=th.value; if(v==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); try{localStorage.setItem('os-theme',v)}catch(e){} }
th.addEventListener('change',applyTheme); applyTheme();
render();
</script>
