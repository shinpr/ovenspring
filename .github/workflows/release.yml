name: Release

# A person publishes a release, its tag and notes together. This then builds the executable for
# each platform with the dashboard inside, tests it there, and attaches the archives, SHA256SUMS
# and install.sh, all at once and only after every platform has passed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The server embeds dashboard/dist at build time, so the dashboard is built first.
      - name: Install pnpm
        # Version is taken from the `packageManager` field in dashboard/package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.100.0
          target: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test on this platform
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build the executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack the executable
        run: tar -czf "ovenspring-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" ovenspring

      - name: Keep the archive for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ovenspring-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The executable reports the crate's version, and the dashboard compares it with the latest
      # release's tag.
      - name: Check the tag names the crate's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match the crate's version $version" >&2
            exit 1
          fi

      - name: Collect the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true

      - name: Attach the archives, the checksums and the install script
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd archives && sha256sum ovenspring-*.tar.gz > ../SHA256SUMS)
          gh release upload "$TAG" archives/ovenspring-*.tar.gz SHA256SUMS install.sh
